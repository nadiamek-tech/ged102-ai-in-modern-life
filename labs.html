<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Labs · GED 102</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Schibsted+Grotesk:wght@400;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="assets/course.css">
<link rel="stylesheet" href="assets/hub.css">
</head>
<body>
<main class="hub">
  <h1>Labs</h1>
  <p class="lede">Part 2 of every lecture: free AI tools you try yourself. Open the tool, or open the lab steps inside the lecture.</p>
  <div id="labs"></div>
</main>
<script src="assets/course-data.js"></script>
<script src="assets/credentials.js"></script>
<script src="assets/course.js"></script>
<script src="assets/hub.js"></script>
<script>
const {C,esc}=Hub; Hub.top('labs.html');
const weeks=[...new Set(C.labs.map(l=>l[0]))];
document.getElementById('labs').innerHTML=weeks.map(n=>{ const w=C.weeks.find(x=>x[0]===n);
  return `<h2>Week ${n} · ${esc(w[1])}</h2><div class="labgrid">${C.labs.filter(l=>l[0]===n).map(([,name,what,url,s])=>
    `<div class="lab"><span class="eyebrow">Free tool</span><b>${esc(name)}</b><span>${esc(what)}</span>
     <div class="row"><a class="btn" href="${url}" target="_blank" rel="noopener">Open tool ↗</a><a class="btn ghost" href="${w[4]}#s${s}">Lab steps →</a></div></div>`).join('')}</div>`; }).join('')
  +`<p class="foot">More labs appear as new lectures are released.</p>`;
</script>
</body>
</html>
