<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Week 1 · Introduction to AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Schibsted+Grotesk:wght@400;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="assets/course.css">
<style>
:root{--wk:#3D4FA0;--wk-soft:rgba(61,79,160,.10);--wk-d:#97A6F2;--wk-soft-d:rgba(151,166,242,.14)}
.quad{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;font-family:var(--f-display)}
.quad .h{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center;padding:4px}
.quad button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:14px 10px;cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:.95rem;min-height:72px}
.quad button[aria-pressed="true"]{border-color:var(--wk);background:var(--wk-soft)}
.quad button.modern::after{content:"most modern AI";display:block;font-family:var(--f-mono);font-size:.62rem;font-weight:400;color:var(--wk);letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.mail{width:100%;border-collapse:collapse;font-family:var(--f-display);font-size:.86rem}
.mail td,.mail th{padding:6px;border-bottom:1px solid var(--line);text-align:left}
.mail th{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:400}
.w{display:inline-block;font-family:var(--f-mono);font-size:.72rem;border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin:2px;background:var(--bg)}
.w.pos{border-color:var(--bad);color:var(--bad)} .w.neg{border-color:var(--good);color:var(--good)}
.scroll{overflow-x:auto}
@media (max-width:520px){.quad button{font-size:.85rem;padding:10px 6px}}
</style>
</head>
<body>
<script src="assets/credentials.js"></script>
<script src="assets/course.js"></script>
<script>
const {W,B}=Lecture;

/* ---------- 2×2 definitions ---------- */
const QUAD={
 'Thinking humanly':['Copy how the human mind works. Linked to cognitive science and psychology.','Computer models of human memory and problem-solving, tested against how real people behave in experiments.'],
 'Acting humanly':['Behave so that a person cannot tell the difference. This is the Turing Test idea.','A chatbot judged by whether people think they are talking to a human.'],
 'Thinking rationally':['Reason with correct logic, like a maths proof. Used in early AI.','The Logic Theorist (Newell and Simon, 1956) proved theorems from a mathematics textbook.'],
 'Acting rationally':['Pick the best action to reach a goal: a “rational agent”. Most modern AI follows this view.','A navigation app choosing the fastest route with the traffic data it has.']};
function quad(el){
  const k=Object.keys(QUAD);
  el.innerHTML=`<div class="quad"><span></span><span class="h">Like a human</span><span class="h">Rationally (ideal)</span>
   <span class="h">Thinking</span><button type="button" data-k="${k[0]}">Thinking humanly</button><button type="button" data-k="${k[2]}">Thinking rationally</button>
   <span class="h">Acting</span><button type="button" data-k="${k[1]}">Acting humanly</button><button type="button" class="modern" data-k="${k[3]}">Acting rationally</button></div><div class="pick-detail"></div>`;
  const bs=el.querySelectorAll('.quad button'), d=el.querySelector('.pick-detail');
  bs.forEach(b=>b.addEventListener('click',()=>{ bs.forEach(x=>x.setAttribute('aria-pressed',x===b)); const [def,ex]=QUAD[b.dataset.k]; d.innerHTML=`<b>${b.dataset.k}</b><p>${def}</p><p><span class="tag">Example</span> ${ex}</p>`; }));
  bs[3].click();
}

/* ---------- rules vs learning spam filter ---------- */
const MAILS=[['FREE MONEY waiting for you!!!',1],['F-R-E-E m0ney, claim now',1],['Your Nol card top-up receipt',0],['You won a prize, send your bank details',1],['Meeting moved to 3 pm',0],['Limited offer: click to claim your reward',1],['GED 102 quiz grades are posted',0],['Free pizza at the student club today',0]];
const WTS={'won':2,'prize':2,'bank details':2,'m0ney':2,'claim':1.5,'click':1.5,'reward':1.5,'money':1.2,'offer':1,'!!!':1,'free':.8,'meeting':-1,'quiz':-1,'receipt':-1,'club':-.5,'pizza':-.5};
function spam(el){
  el.innerHTML=`<div class="ui stack">
   <label for="rule">Rule-based filter: block an email if it contains…</label><input type="text" id="rule" value="FREE MONEY">
   <div class="scroll"><table class="mail"><thead><tr><th>Email subject</th><th>Really</th><th>Rule filter</th><th>Learning filter</th></tr></thead><tbody id="mb"></tbody></table></div>
   <div class="stat" id="ms" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px"></div>
   <div><span class="mono" style="color:var(--muted)">LEARNED WEIGHTS (illustrative) · red pushes towards spam, green towards normal</span><div>${Object.entries(WTS).map(([w,v])=>`<span class="w ${v>0?'pos':'neg'}">${w} ${v>0?'+':''}${v}</span>`).join('')}</div></div></div>`;
  const draw=()=>{ const r=el.querySelector('#rule').value.trim().toLowerCase(); let rc=0,lc=0;
    el.querySelector('#mb').innerHTML=MAILS.map(([s,y])=>{ const low=s.toLowerCase(); const rb=r&&low.includes(r)?1:0; let sc=0; for(const [w,v] of Object.entries(WTS)) if(low.includes(w)) sc+=v; const lb=sc>=2?1:0; if(rb===y)rc++; if(lb===y)lc++;
      const t=(p)=>p?'<span class="tag bad">blocked</span>':'<span class="tag">inbox</span>';
      return `<tr><td>${s}</td><td>${y?'<b>spam</b>':'normal'}</td><td>${t(rb)} ${rb===y?'✓':'✗'}</td><td>${t(lb)} ${lb===y?'✓':'✗'}</td></tr>`; }).join('');
    el.querySelector('#ms').innerHTML=`<div class="feedback"><b>Rule filter: ${rc}/8 correct</b></div><div class="feedback"><b>Learning filter: ${lc}/8 correct</b></div>`; };
  el.querySelector('#rule').addEventListener('input',draw); draw();
}

/* ---------- foundations ---------- */
const FIELDS={'Foundations':[['Philosophy','What is mind? Can reasoning be mechanical? Philosophers asked these questions long before computers existed.'],['Mathematics','Logic, algebra and probability are the language AI is written in.'],['Statistics','Learning patterns from data and measuring uncertainty. Most modern AI is statistics at very large scale.'],['Neuroscience','The brain inspired artificial neural networks: many simple units connected together.'],['Computer science','Algorithms and hardware that make AI possible, from search methods to the chips that train models.'],['Linguistics','How language works: the basis of translation tools and chatbots.'],['Psychology','How humans learn, perceive and decide.'],['Economics','Decision theory and rational choice: how an agent should choose the best action.']]};

/* ---------- ANI / AGI / ASI ---------- */
const LADDER=`<svg viewBox="0 0 560 250" role="img" aria-label="Three steps: narrow AI exists today; general AI and super AI do not exist">
 <rect x="20" y="170" width="160" height="60" rx="8" fill="var(--wk)"/>
 <rect x="200" y="110" width="160" height="120" rx="8" fill="var(--wk-soft)" stroke="var(--wk)" stroke-dasharray="5 4"/>
 <rect x="380" y="50" width="160" height="180" rx="8" fill="none" stroke="var(--muted)" stroke-dasharray="5 4"/>
 <text x="100" y="196" text-anchor="middle" font-size="14" font-weight="700" style="fill:var(--surface)">Narrow AI</text>
 <text x="100" y="214" text-anchor="middle" font-size="11" style="fill:var(--surface)">one task · exists today</text>
 <text x="280" y="136" text-anchor="middle" font-size="14" font-weight="700">General AI</text>
 <text x="280" y="154" text-anchor="middle" font-size="11" class="t-muted">any task like a human</text>
 <text x="280" y="170" text-anchor="middle" font-size="11" class="t-muted">does not exist yet</text>
 <text x="460" y="76" text-anchor="middle" font-size="14" font-weight="700">Super AI</text>
 <text x="460" y="94" text-anchor="middle" font-size="11" class="t-muted">beyond humans in everything</text>
 <text x="460" y="110" text-anchor="middle" font-size="11" class="t-muted">theoretical · debated</text>
 <path d="M100 160 L100 132" stroke="var(--wk)" stroke-width="2"/><circle cx="100" cy="126" r="6" fill="var(--wk)"/>
 <text x="100" y="114" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--wk)">we are here</text>
 <text x="100" y="246" text-anchor="middle" font-size="10" class="t-muted t-mono">chess · translation · face unlock · ChatGPT</text></svg>`;

/* ---------- Turing vs Chinese Room ---------- */
const TESTS=`<svg viewBox="0 0 580 250" role="img" aria-label="Left: a judge chats through a screen with a hidden human and a hidden machine. Right: a person in a room uses a rule book to answer Chinese notes without understanding them.">
 <text x="10" y="18" font-size="11" class="t-muted t-mono">TURING TEST · 1950</text>
 <circle cx="60" cy="110" r="22" fill="var(--wk-soft)" stroke="var(--wk)"/><text x="60" y="114" text-anchor="middle" font-size="11">Judge</text>
 <line x1="120" y1="40" x2="120" y2="200" stroke="var(--ink)" stroke-width="3"/><text x="120" y="218" text-anchor="middle" font-size="10" class="t-muted">screen</text>
 <rect x="160" y="55" width="96" height="40" rx="6" fill="var(--sunk)" stroke="var(--line)"/><text x="208" y="80" text-anchor="middle" font-size="11">Human</text>
 <rect x="160" y="130" width="96" height="40" rx="6" fill="var(--sunk)" stroke="var(--line)"/><text x="208" y="155" text-anchor="middle" font-size="11">Machine</text>
 <path d="M84 100 L156 76 M84 118 L156 150" stroke="var(--muted)" stroke-dasharray="3 3"/>
 <text x="140" y="240" text-anchor="middle" font-size="11">Pass = judge cannot tell which is which</text>
 <line x1="290" y1="20" x2="290" y2="235" stroke="var(--line)"/>
 <text x="306" y="18" font-size="11" class="t-muted t-mono">CHINESE ROOM · SEARLE 1980</text>
 <rect x="360" y="50" width="170" height="150" rx="8" fill="var(--sunk)" stroke="var(--line)"/>
 <circle cx="420" cy="120" r="18" fill="var(--surface)" stroke="var(--line)"/><text x="420" y="124" text-anchor="middle" font-size="10">person</text>
 <rect x="455" y="105" width="56" height="34" rx="3" fill="var(--surface)" stroke="var(--wk)"/><text x="483" y="126" text-anchor="middle" font-size="10">rule book</text>
 <rect x="310" y="92" width="44" height="22" rx="3" fill="var(--surface)" stroke="var(--line)"/><text x="332" y="107" text-anchor="middle" font-size="12">你好?</text>
 <path d="M354 103 L380 110" stroke="var(--muted)" marker-end="url(#a1)"/>
 <rect x="536" y="128" width="40" height="22" rx="3" fill="var(--surface)" stroke="var(--line)"/><text x="556" y="143" text-anchor="middle" font-size="12">你好!</text>
 <path d="M511 132 L534 138" stroke="var(--muted)" marker-end="url(#a1)"/>
 <text x="445" y="226" text-anchor="middle" font-size="11">Right answers, zero understanding?</text>
 <defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="var(--muted)"/></marker></defs></svg>`;

Lecture.mount({
  id:'w1', week:1, clo:1, short:'Week 1 · Introduction to AI',
  title:'Introduction to AI',
  meta:'RB b Chapter 1 · 3-hour session',
  scenes:[
  { nav:'Start here', title:'What is AI, and can machines out-think us?', minutes:10,
    narration:[
     `This week asks the first question of the course: what exactly is artificial intelligence? By the end you will have a clear definition, four ways of thinking about AI, and an answer to the question every student secretly wants to ask: can a computer ever really be smarter than a human being?`,
     `Our syllabus topics: <strong>What is AI? · The Foundations of Artificial Intelligence · Is AI a real science? · Can a computer ever really be smarter than a human being?</strong> This week builds <strong>CLO 1</strong>: explain the fundamental concepts, history, and development of artificial intelligence.`,
     B.plain(`Every topic follows the same four steps: <b>what is it</b>, a <b>simple example</b>, the <b>risks</b>, and <b>what to remember for the exam</b>. Purple boxes explain in plain words. Blue boxes give everyday examples. Amber boxes are for the exam.`)],
    think:`Write a one-sentence definition of AI on paper, before you read anything else. We will compare it with the textbook definitions later.`,
    src:`Reading: Kaplan, J. (2016). <em>Artificial intelligence: What everyone needs to know</em>. Oxford University Press. Chapter 1.`,
    notes:[`Hook: students write their one-sentence definition. Keep the papers; return to them in Scene 2.`,`Explain the colour code once. It is the same in every week and in the midterm review page.`],
    fig:{label:`Today's session · 180 minutes`, build:el=>W.agenda(el,[[`Start here`,10,'l'],[`Hook: is it AI?`,10,'a'],[`What is AI?`,15,'l'],[`Four ways to define AI`,15,'l'],[`AI vs ordinary software`,20,'a'],[`The foundations`,10,'l'],[`Break`,10,'b'],[`Is AI a real science?`,15,'l'],[`Machine or human: who wins?`,20,'a'],[`Turing Test vs Chinese Room`,25,'a'],[`Exam takeaways`,15,'l'],[`Exit check`,15,'c']])} },

  { nav:'Is it AI?', title:'Activity · Is it AI or not?', kind:'activity', minutes:10,
    narration:[
     `Before any definitions, use your instinct. For each item, decide: is it AI, not AI, or does it depend?`,
     `Then reveal the suggested answers. Pay attention to <em>why</em> each one is or is not AI. The reasons are this week's definition in disguise.`],
    notes:[`Pairs, 6 minutes. Then ask: what did all the “AI” items have in common? Expected answer: they learn from data or adapt.`],
    fig:{label:`Sort the items`, build:el=>W.sort(el,{buckets:['AI','Not AI','Depends'],items:[
      {t:`Face unlock on your phone`,a:0,why:`It learned to recognise faces from many examples.`},
      {t:`A calculator`,a:1,why:`It follows fixed rules; 2 + 2 is always 4.`},
      {t:`Your email spam filter`,a:0,why:`Modern filters learn what spam looks like.`},
      {t:`A thermostat that switches on at 25 °C`,a:1,why:`One fixed rule. A thermostat that learns your routine would count as AI.`},
      {t:`Google Maps predicting traffic`,a:0,why:`It predicts from patterns in huge amounts of location data.`},
      {t:`A chess program`,a:2,why:`Old programs used hand-written rules and search (still AI, but no learning). Modern ones learn from self-play.`},
      {t:`ChatGPT`,a:0,why:`A large language model trained on huge amounts of text.`},
      {t:`A TV remote control`,a:1,why:`Buttons send fixed signals. No intelligence involved.`}]})} },

  { nav:'What is AI?', video:{id:'a0_lo_GDcFw',title:'What Is Artificial Intelligence? Crash Course AI #1',by:'CrashCourse',why:'A friendly overview of what AI is, and where it already shows up in daily life.'}, title:'What is AI?', minutes:15,
    narration:[
     `Artificial intelligence is not one gadget. It is a goal, a field of study, and a family of very different tools.`,
     B.plain(`<b>Artificial Intelligence (AI)</b> is the field of building computer systems that do tasks which normally need human intelligence: understanding language, recognising images, making decisions, learning from experience.<ul><li><b>AI is a goal:</b> machines that behave intelligently.</li><li><b>AI is a field:</b> computer science plus maths, statistics, linguistics and psychology.</li><li><b>AI is not one thing:</b> spam filters, chatbots and self-driving cars are all AI.</li></ul>`),
     B.ex(`Your phone unlocks with your face. Your email hides spam. Maps predict traffic. Nobody wrote a rule for every face, spam word or road: the systems learned patterns. That is everyday AI.`),
     B.exam(`<b>Exam definition:</b> AI = computer systems performing tasks that normally require human intelligence.`)],
    think:`Compare your one-sentence definition with the one above. What did you include that the textbook left out, or the other way round?`,
    notes:[`Stress: AI is a goal (intelligent behaviour) and a field, not one single technology.`],
    fig:{label:`Everyday AI · what did it learn?`, build:el=>W.picker(el,{'On your phone':[[`Face unlock`,`Learned what your face looks like from different angles and lighting, so it can recognise you without a rule for every pixel.`],[`Autocorrect`,`Learned which words usually follow each other, so it can guess what you meant to type.`],[`Photo search`,`Search your gallery for “beach” or “cat” because a model learned what those look like.`]],'Online':[[`Spam filter`,`Learned the patterns of spam from millions of emails that people marked as spam.`],[`Maps traffic`,`Learned how traffic usually moves at each time of day from location data, and predicts your arrival time.`],[`Recommendations`,`Learned what people like you watched next. We study this in Week 4.`]]})} },

  { nav:'Four definitions', title:'Four ways to define AI', minutes:15,
    narration:[
     `Researchers disagree about what AI should aim for. Should it copy humans, or do the ideal, logical thing? Should we judge its <em>thinking</em> or its <em>behaviour</em>? Two questions give four views.`,
     B.plain(`<ul><li><b>Thinking humanly:</b> copy how the human mind works.</li><li><b>Acting humanly:</b> behave so a person cannot tell the difference (the Turing Test idea).</li><li><b>Thinking rationally:</b> reason with correct logic, like a maths proof.</li><li><b>Acting rationally:</b> pick the best action to reach a goal. Most modern AI follows this view.</li></ul>`),
     B.exam(`Memorise the 2×2: <b>Human vs Rational × Thinking vs Acting</b>. Modern AI mostly = acting rationally.`)],
    think:`Which of the four views do you personally believe is “real” AI? Why?`,
    src:`Framework from Russell, S., & Norvig, P. <em>Artificial Intelligence: A Modern Approach</em>.`,
    notes:[`Ask students which one they believe in. Modern engineering mostly follows “acting rationally”: do the right thing to reach a goal.`],
    fig:{label:`The 2×2 · click each view`, build:quad} },

  { nav:'AI vs software', title:'AI vs ordinary software', kind:'activity', minutes:20, wide:true,
    narration:[
     `Ordinary software follows rules a programmer wrote. Machine learning finds the rules itself, from examples. This is the most important distinction in the whole course.`,
     `<table class="tbl"><thead><tr><th></th><th>Ordinary software</th><th>AI (machine learning)</th></tr></thead><tbody><tr><td>How it works</td><td>Programmer writes exact rules</td><td>Learns patterns from examples</td></tr><tr><td>Input → output</td><td>Rules + data → answers</td><td>Data + answers → rules</td></tr><tr><td>New cases?</td><td>Only if a rule exists</td><td>Often yes, by generalising</td></tr><tr><td>Example</td><td>Calculator</td><td>Spam filter</td></tr></tbody></table>`,
     `Try it on the right. Change the rule and watch what happens. Can you write one rule that catches all the spam without blocking the free pizza announcement?`,
     B.exam(`<b>Traditional programming:</b> rules + data → answers. <b>Machine learning:</b> data + answers → rules.`)],
    think:`Spammers change their spelling every week. Which filter keeps working, and why?`,
    notes:[`Students try “free”: it catches more spam but blocks the pizza email. That is the brittleness of rules.`,`The learned weights are illustrative, not from a real filter.`],
    fig:{label:`Rule filter vs learning filter`, build:spam} },

  { nav:'Foundations', title:'The foundations: which fields built AI?', minutes:10,
    narration:[
     `AI did not come from computer science alone. Philosophers, mathematicians, statisticians, brain scientists, linguists, psychologists and economists all contributed.`,
     B.ex(`ChatGPT needs <b>statistics</b> (learning from data), <b>computer science</b> (chips and algorithms), <b>linguistics</b> (how language works) and <b>philosophy</b> (what “understanding” means).`),
     B.exam(`AI is <b>interdisciplinary</b>. Be ready to name at least four foundation fields with one contribution each.`)],
    think:`Which field does your own major connect to? Every student in this room has a link to AI.`,
    notes:[`Syllabus item: The Foundations of Artificial Intelligence. Ask which field matters most for ChatGPT (answer: all, especially statistics, CS and linguistics).`],
    fig:{label:`Eight foundation fields`, build:el=>W.picker(el,FIELDS,'Select a field.')} },

  { nav:'A real science?', title:'Is AI a real science?', minutes:15,
    narration:[
     `Some people say AI is “just engineering”: building things that work without knowing why. Others say it is a science of intelligence. The honest answer is that it is both, and it has open problems.`,
     `<table class="tbl"><tbody><tr><td>Yes: scientific side</td><td>Tests hypotheses, runs experiments, measures results on shared benchmarks, publishes reproducible methods.</td></tr><tr><td>Also: engineering side</td><td>Builds useful systems. Success is “does it work?”, not always “why does it work?”.</td></tr><tr><td>But: open problems</td><td>Models are often black boxes; benchmarks can be gamed; results can be hard to reproduce.</td></tr></tbody></table>`,
     B.ex(`Physics asks “why does an apple fall?” Engineering asks “how do we build a bridge?” AI does both: it studies intelligence and builds intelligent tools.`),
     B.exam(`Good exam answer: AI is both <b>science</b> (understand intelligence) and <b>engineering</b> (build tools). Give one point on each side.`)],
    notes:[`Balanced answer expected. Reproducibility and benchmark gaming are good “open problem” examples.`],
    fig:{label:`Vote`, build:el=>W.poll(el,{q:`Is AI a real science?`,opts:[`Yes, it is a science`,`No, it is engineering`,`Both`,`Neither, it is a business`],reveal:i=>[`Partly right: it tests hypotheses and measures results.`,`Partly right: much of AI is building things that work.`,`This is the strongest exam answer, if you give one reason for each side.`,`Business drives much AI today, but that is about funding, not method.`][i]+` Now name one open problem that makes AI a less “clean” science.`})} },

  { nav:'Machine or human?', title:'Can a computer be smarter than a human?', kind:'activity', minutes:20,
    narration:[
     `It depends on what you mean by “smart”. Machines already beat us at some things. At others, a four-year-old still wins easily.`,
     B.plain(`<b>Narrow AI (ANI):</b> does one task very well. This is <b>all</b> AI that exists today. <b>General AI (AGI):</b> would learn and reason across any task like a human; it does not exist yet. <b>Super AI (ASI):</b> would surpass humans in everything; theoretical and debated.`),
     B.plain(`<b>Moravec's paradox:</b> tasks that are hard for people (chess, big sums) are easy for computers. Tasks that are easy for a child (walking, recognising a friend) are very hard for machines.`),
     B.ex(`A chess program beats every human, but cannot make a cup of tea or explain “why did you move there?” like a person. Superhuman at one thing, helpless at everything else.`),
     `Sort the tasks in the activity below the diagram: who wins today, the machine or the human?`,
     B.exam(`Today = <b>Narrow AI only</b>. Even ChatGPT is narrow: it works on language, not general understanding.`)],
    think:`If a machine beats you at chess but cannot tie its shoes, is it smarter than you?`,
    notes:[`Do not give a date for AGI; experts disagree on timelines.`,`Chess: Deep Blue 1997. Go: AlphaGo 2016. Both return in Week 2.`],
    fig:{label:`Three kinds of AI · then sort the tasks`, build:el=>{ el.innerHTML=LADDER+'<div id="mh" style="margin-top:14px"></div>'; W.sort(el.querySelector('#mh'),{buckets:['Machine wins','Human wins'],items:[
      {t:`Playing chess or Go`,a:0,why:`Deep Blue beat Kasparov in 1997; AlphaGo beat Lee Sedol in 2016.`},
      {t:`Recognising a friend's face in a crowd from behind`,a:1,why:`Humans use context: walk, clothes, where they usually are.`},
      {t:`Scanning a million records in a second`,a:0,why:`Speed and memory are machine strengths.`},
      {t:`Knowing a wet floor is slippery without being told`,a:1,why:`Common sense is still a human strength.`},
      {t:`Learning a new card game from one explanation`,a:1,why:`Humans learn from very few examples.`},
      {t:`Spotting some diseases in medical images`,a:0,why:`In narrow, well-tested tasks AI can match or beat specialists (Week 6).`}]}); }} },

  { nav:'Turing vs Searle', title:'Two famous tests of “real intelligence”', kind:'activity', minutes:25,
    narration:[
     `How would we know if a machine is intelligent? Two famous thought experiments give opposite answers.`,
     B.plain(`<b>Turing Test (1950):</b> a judge chats with a hidden human and a hidden machine. If the judge cannot tell which is which, the machine passes. It tests <b>behaviour</b>, not inner thoughts.`),
     B.plain(`<b>Chinese Room (Searle, 1980):</b> a person who knows no Chinese follows a rule book to answer Chinese questions. The answers are correct, but the person understands nothing. Searle's point: correct answers do not prove <b>understanding</b>.`),
     `Debate in groups: does ChatGPT understand what it writes? Use one of the two tests to support your answer, then vote.`,
     B.exam(`<b>Turing</b> = behaviour counts. <b>Searle</b> = behaviour is not understanding. Both appear in “Can machines think?” essays.`)],
    think:`Is your own understanding of a language anything more than a very good rule book? How would you prove it?`,
    notes:[`Groups of four, 10 minutes debate, two groups present for 2 minutes each, then vote.`,`Link forward: Week 3 shows how ChatGPT actually produces text.`],
