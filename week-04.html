<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Week 4 · AI in Everyday Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Schibsted+Grotesk:wght@400;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="assets/course.css">
<style>
:root{--wk:#A8336B;--wk-soft:rgba(168,51,107,.10);--wk-d:#F08DBD;--wk-soft-d:rgba(240,141,189,.14)}
.hunt{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;font-family:var(--f-display);font-size:.9rem}
.hunt label{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);font-weight:400;cursor:pointer}
.hunt label:has(input:checked){border-color:var(--wk);background:var(--wk-soft)}
.feed{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.feed button{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);cursor:pointer;text-align:left;font-family:var(--f-display);font-size:.84rem;min-height:70px}
.feed button b{display:block;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.wbars{display:grid;gap:4px;font-family:var(--f-display);font-size:.8rem}
.wbars div{display:grid;grid-template-columns:80px minmax(0,1fr) 34px;gap:6px;align-items:center}
.wbars i{display:block;height:10px;border-radius:3px}
@media (max-width:520px){.feed{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<script src="assets/gate.js"></script>
</head>
<body>
<script src="assets/professor.js"></script>
<script src="assets/course-data.js"></script>
<script src="assets/credentials.js"></script>
<script src="assets/supports.js"></script>
<script src="assets/course.js"></script>
<script src="assets/kb.js"></script>
<script src="assets/search-index.js"></script>
<script src="assets/assistant.js"></script>
<script src="assets/onepage.js"></script>
<script>
const {W,B}=Lecture;

/* ---------- phone hunt ---------- */
const HUNT=['Face or fingerprint unlock','Voice assistant','Autocorrect / predictive text','Photo search (“beach”, “cat”)','Maps arrival time','Spam or unknown-caller filter','“Recommended for you” feed','Camera night mode or portrait blur','Translate app or camera translation','Suspicious-login alert'];
function hunt(el){
  el.innerHTML=`<div class="hunt">${HUNT.map((h,i)=>`<label><input type="checkbox" id="h${i}"> ${h}</label>`).join('')}</div><div class="feedback" id="hc" style="margin-top:10px"></div>`;
  const upd=()=>{ const n=el.querySelectorAll('input:checked').length; el.querySelector('#hc').innerHTML=`<b>${n} of ${HUNT.length}</b> found on your phone. ${n>=7?'Your phone is an AI device in your pocket.':n?'Keep looking: check your camera and keyboard settings.':'Open your phone and start ticking.'}`; };
  el.querySelectorAll('input').forEach(i=>i.addEventListener('change',upd)); upd();
}

/* ---------- filter bubble ---------- */
const CATS=[['Cooking','var(--warn)'],['Football','var(--good)'],['Science','var(--wk)'],['Music','var(--plain)'],['Travel','var(--ex)'],['Gaming','var(--bad)']];
const TITLES={Cooking:['5-minute karak','Machboos at home','Easy kunafa'],Football:['Top 10 goals','Match highlights','Training drills'],Science:['How black holes form','Why the sky is blue','AI explained'],Music:['Oud covers','Studio session','Live concert'],Travel:['48 hours in Muscat','Hidden Dubai','Hatta weekend'],Gaming:['Speedrun record','New release review','Boss fight guide']};
function bubble(el){
  let wts=CATS.map(()=>1), clicks=0;
  el.innerHTML=`<div class="ui stack"><div class="feed" id="fd"></div><div class="row"><span class="mono" id="fs"></span><button class="btn ghost" id="fr" type="button">Reset feed</button></div><div class="wbars" id="fw"></div></div>`;
  const pickFeed=()=>{ const out=[]; const pw=wts.map(w=>w*w); for(let k=0;k<6;k++){ const s=pw.reduce((a,b)=>a+b,0); let r=Math.random()*s, i=0; for(;i<pw.length;i++){ r-=pw[i]; if(r<=0) break; } i=Math.min(i,pw.length-1); out.push(i); } return out; };
  const draw=()=>{ const f=pickFeed(); const kinds=new Set(f).size;
    el.querySelector('#fd').innerHTML=f.map(i=>{ const [c,col]=CATS[i]; const t=TITLES[c][Math.floor(Math.random()*3)]; return `<button type="button" data-i="${i}"><b style="color:${col}">${c}</b>${t}</button>`; }).join('');
    el.querySelectorAll('#fd button').forEach(b=>b.addEventListener('click',()=>{ wts[+b.dataset.i]+=1; clicks++; draw(); }));
    const tot=wts.reduce((a,b)=>a+b*b,0);
    el.querySelector('#fw').innerHTML=CATS.map(([c,col],i)=>`<div><span>${c}</span><span style="background:var(--sunk);border-radius:3px"><i style="width:${(wts[i]*wts[i]/tot*100).toFixed(0)}%;background:${col}"></i></span><span class="mono">${(wts[i]*wts[i]/tot*100).toFixed(0)}%</span></div>`).join('');
    el.querySelector('#fs').textContent=`${clicks} clicks · ${kinds} of 6 topics in your feed`; };
  el.querySelector('#fr').addEventListener('click',()=>{ wts=CATS.map(()=>1); clicks=0; draw(); });
  draw();
}

/* ---------- COMPAS chart ---------- */
const COMPAS=(()=>{ const Y=v=>190-v/50*160; const bars=[['Black defendants',44.9,'var(--bad)'],['White defendants',23.5,'var(--muted)']];
 return `<svg viewBox="0 0 420 240" role="img" aria-label="Among defendants who did not reoffend, 44.9 percent of Black defendants and 23.5 percent of white defendants were labelled high risk">
  ${[0,10,20,30,40,50].map(v=>`<line x1="60" x2="400" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width=".7"/><text x="52" y="${Y(v)+3}" text-anchor="end" font-size="10" class="t-muted t-mono">${v}%</text>`).join('')}
  ${bars.map(([t,v,c],i)=>`<rect x="${100+i*150}" y="${Y(v)}" width="90" height="${Y(0)-Y(v)}" rx="4" fill="${c}"/><text x="${145+i*150}" y="${Y(v)-8}" text-anchor="middle" font-size="14" font-weight="700">${v}%</text><text x="${145+i*150}" y="210" text-anchor="middle" font-size="11">${t}</text>`).join('')}
  <text x="230" y="234" text-anchor="middle" font-size="10" class="t-muted">Wrongly labelled high risk, among people who did not reoffend · ProPublica (2016)</text></svg>`; })();

/* ---------- figures and videos kept from the original lecture ---------- */
const FIG={
 'AI in your pocket':{label:`Phone AI hunt`, build:hunt},
 'Recommendations':{flow:[{t:'Collect',s:'watch, like, skip',d:'The app records what you watch, like and skip.'},{t:'Compare',s:'people like you',d:'It finds users whose history looks like yours.'},{t:'Predict',s:'your next click',d:'It estimates what you are most likely to click next.'},{t:'Show',s:'your feed',d:'It fills your feed with those predictions. Your clicks feed step 1 again: a loop.'}],label:`Your feed · click what you like`, build:bubble},
 'Social equity':{label:`Four lenses · click each`, build:el=>W.picker(el,{'Lenses':[[`Access`,`Who has the devices, internet, English skills and training to use AI?`],[`Representation`,`Is the training data about everyone, or mostly one group?`],[`Outcomes`,`Does AI treat groups fairly in hiring, loans, justice and health?`],[`Power`,`Who owns the data, the models and the profits?`]]})},
 'Who benefits?':{label:`Where do you stand?`, build:el=>W.poll(el,{q:`In your future career, where do you expect to stand?`,opts:[`Likely to benefit`,`At some risk`,`Both, depending on my choices`,`I don't know yet`],reveal:i=>[`What will you do to keep that advantage, and who could you help?`,`Which skill would move you to the other column? Assignment 4 later asks you to imagine this future.`,`The most realistic answer for most people. The choices are the point of this week.`,`An honest answer. This course is designed to help you find out.`][i]})},
 'Biased algorithms':{label:`COMPAS · false “high risk” labels`, html:COMPAS},
 'Inevitable?':{label:`Vote after the debate`, build:el=>W.poll(el,{q:`Are the disruptive effects of AI inevitable?`,opts:[`Yes, technology decides`,`No, people decide`,`Partly: the change is coming, the shape is our choice`],reveal:i=>[`That is technological determinism. Your opponents will point to ATMs and to policy.`,`That is the social-choice view. Your opponents will point to how fast AI is spreading.`,`The strongest exam answer: name both views, then use evidence (IMF 40%, ATMs).`][i]})},
 'Exam takeaways':{mindmap:{center:'Who does AI affect?',branches:[{t:'Everyday AI',items:['Face unlock · maps · spam','Mostly narrow AI','Prediction from data']},{t:'Recommendations',items:['Collect · compare · predict · show','Risk: filter bubble']},{t:'Equity lenses',items:['Access','Representation','Outcomes','Power']},{t:'Who benefits',items:['Data, capital, skills, access','At risk: routine jobs','At risk: under-represented groups']},{t:'Bias cases',items:['COMPAS: 44.9% vs 23.5%','Amazon recruiting tool (2018)']},{t:'Inevitable?',items:['Determinism vs choice','IMF 2024: ≈40% of jobs exposed','ATMs and bank tellers']}]},label:`The week as a mind map · then likely exam questions`, build:el=>W.practice(el,[
      {q:`Give three examples of AI in everyday life.`,hint:`Recommendations, maps traffic, face unlock, spam filters, autocorrect; say what each predicts.`},
      {q:`What is algorithmic bias? Give a real case.`,hint:`Unfair results from biased data or design; COMPAS (44.9% vs 23.5%) or the Amazon recruiting tool.`},
      {q:`Who benefits from AI and who is at risk?`,hint:`Those with data, capital, skills and access vs those without; use the four equity lenses.`},
      {q:`Are the disruptive effects of AI inevitable? Argue.`,hint:`Both views; evidence: IMF 2024 (≈40% of jobs exposed), ATMs and tellers; conclude that choices shape outcomes.`}])},
 'Exit check':{label:`Six questions`, build:el=>W.quiz(el,[
      {q:`A “filter bubble” happens when…`,o:[`your phone overheats`,`recommendations narrow what you see the more you click`,`an app blocks spam`,`you turn off personalisation`],a:1,why:`Feedback loops narrow the feed.`},
      {q:`Which is NOT one of the four equity lenses?`,o:[`Access`,`Representation`,`Speed`,`Power`],a:2,why:`The lenses are access, representation, outcomes and power.`},
      {q:`ProPublica's COMPAS analysis found that…`,o:[`the tool was perfectly fair`,`Black non-reoffenders were wrongly labelled high risk about twice as often`,`the tool was never used in courts`,`white defendants were always labelled high risk`],a:1,why:`44.9% vs 23.5%; the vendor disputed the analysis.`},
      {q:`Why did Amazon's recruiting tool downgrade women's CVs?`,o:[`It was told to`,`It learned from past hires who were mostly men`,`Women applied less`,`A bug in the website`],a:1,why:`Biased training data.`},
      {q:`The IMF (2024) estimated that about what share of jobs worldwide are exposed to AI?`,o:[`4%`,`40%`,`90%`,`100%`],a:1,why:`About 40% worldwide, about 60% in advanced economies.`},
      {q:`The ATM example shows that…`,o:[`technology always destroys jobs`,`disruption is real but shaped by choices`,`banks stopped hiring`,`ATMs use AI`],a:1,why:`Teller jobs changed rather than vanished for years.`}])}
};
const V={
 'Biased algorithms':{id:'UG_X_7g63rY',title:"How I'm fighting bias in algorithms",by:'TED · Joy Buolamwini',why:'A researcher discovers that face-analysis software failed to see her face, and asks why.'}
};

Lecture.mount({
  id:'w4', week:4, clo:2, short:'Week 4 · AI in Everyday Life',
  title:'AI in Everyday Life',
  meta:'RB a Chapter 13 · RB b Chapter 7 · 3 hours',
  scenes:[
  { part:1, nav:'AI in your pocket', title:'AI is already in your pocket',
    narration:[`Take out your phone and tick every AI feature you used today. Face unlock, autocorrect, photo search, maps and your feeds are all narrow AI making predictions from data, most of the time without you noticing.`],
    fig:FIG['AI in your pocket'] },

  { part:1, nav:'Recommendations', title:'How your feed decides what you see', full:true,
    narration:[`A recommender collects what you watch, like and skip, compares you with similar users, predicts your next click and fills your feed with it. Your clicks then feed the next round, so the loop can narrow what you see into a filter bubble. Click a few videos below and watch your feed change.`],
    fig:FIG['Recommendations'] },

  { part:1, nav:'Social equity', title:'Social equity: four lenses',
    narration:[`Social equity asks whether AI's benefits and harms are shared fairly. Four lenses help: who has access, who is represented in the data, who is affected by decisions, and who has a voice in how systems are built.`],
    fig:FIG['Social equity'] },

  { part:1, nav:'Who benefits?', title:'Who benefits from the AI revolution?',
    narration:[`AI creates winners and losers at the same time. People with skills, data and capital tend to gain first, while routine jobs and groups missing from the data carry more of the risk. Where do you expect to stand?`],
    fig:FIG['Who benefits?'] },

  { part:2, nav:'My Ad Center', title:'See what Google thinks you like',
    narration:[`Google's My Ad Center shows the topics, brands and personal details it uses to choose your ads. Sign in with your own account, compare its guesses with reality, and switch off one topic you do not want to be targeted by.`],
    fig:{label:`Tools lab`, build:el=>W.tool(el,{name:'My Ad Center',by:'Google',account:'Google account',url:'https://myadcenter.google.com/',steps:[
      {t:'Sign in',s:'your account',d:'Open My Ad Center with your own Google account.'},
      {t:'Read',s:'topics and brands',d:'List three guesses that are right and one that is wrong.'},
      {t:'Explain',s:'why that guess?',d:'Which of your searches or videos could have produced each guess?'},
      {t:'Control',s:'switch one off',d:'Turn off one topic, or turn personalised ads off completely.'}]})} },

  { part:2, nav:'Survival of the Best Fit', title:'Build a hiring algorithm, then watch it go wrong',
    narration:[`Survival of the Best Fit is a short game made by students at NYU Abu Dhabi. You hire people by hand, then hand the job to a machine that learns from your past choices. Play it to the end and explain where the bias came from.`],
    fig:{label:`Tools lab`, build:el=>W.tool(el,{name:'Survival of the Best Fit',by:'NYU Abu Dhabi students · 10 minutes',url:'https://www.survivalofthebestfit.com/',steps:[
      {t:'Hire',s:'by hand',d:'Choose candidates for your company as fast as you can.'},
      {t:'Automate',s:'train the model',d:'The game trains a model on your past decisions.'},
      {t:'Watch',s:'who gets rejected',d:'Notice which group the model starts to reject, and why.'},
      {t:'Explain',s:'one sentence',d:'Write down where the bias came from: the model, or the data you gave it?'}]})} },

  { part:3, nav:'Case: COMPAS', title:'Case: a risk score in court',
    narration:[`COMPAS scores defendants in some US courts on how likely they are to reoffend. In 2016 ProPublica found that Black defendants who did not reoffend were almost twice as likely as white defendants to be wrongly labelled high risk. The data reflected past policing, and the model learned it.`],
    src:`Source: Angwin, J. et al. (2016). <a href="https://www.propublica.org/article/machine-bias-risk-assessments-in-criminal-sentencing" target="_blank" rel="noopener">Machine Bias</a>. ProPublica.`,
    fig:FIG['Biased algorithms'] },

  { part:3, nav:'Case: Amazon hiring', title:'Case: the hiring tool that learned to prefer men',
    narration:[`Amazon built a tool to rate job applicants, trained on ten years of CVs that came mostly from men. It learned to mark down CVs that included the word “women's”, and Amazon dropped the project. It is the real version of the game you just played.`],
    fig:{label:`Real case`, build:el=>W.news(el,{outlet:'Reuters via CNBC',date:'10 October 2018',head:'Amazon scraps a secret AI recruiting tool that showed bias against women',dek:'The model was trained on a decade of CVs, most of them from men, and penalised CVs that included the word “women’s”.',url:'https://www.cnbc.com/2018/10/10/amazon-scraps-a-secret-ai-recruiting-tool-that-showed-bias-against-women.html'})} },

  { part:3, nav:'Watch: Buolamwini', title:'Watch: “the coded gaze”',
    narration:[`Joy Buolamwini found that face-analysis software failed to see her face until she wore a white mask. Watch her talk and note the three steps she proposes for fairer code.`],
    fig:{label:`Watch`, build:el=>W.video(el,V['Biased algorithms'])} },

  { part:3, nav:'Inevitable?', title:'Debate: are the disruptive effects inevitable?',
    narration:[`One side says technology decides and the disruption is coming whatever we do. The other says people decide, through laws, companies and choices. Debate in two groups, then vote.`],
    fig:FIG['Inevitable?'] },

  { part:3, kind:'bonus', nav:'AI Nerd', title:'AI Nerd · take it further',
    narration:[`IBM's free Machine Learning and Deep Learning course shows how the models behind your feed are trained. It is course 3 of the AI Fundamentals badge. Finish it and send your proof for a class-activity bonus.`] },

  { part:4, nav:'Practise & remember', title:'Practise & remember', full:true,
    narration:[`Open each branch of the mind map, then answer the six questions. Before Week 5, read TB Chapter 5 on large language models in education.`],
    fig:{label:`The week in one map · then six questions`, mindmap:FIG['Exam takeaways'].mindmap, build:FIG['Exit check'].build} }
  ]
});
</script>
</body>
</html>
