<head>

<style>
:root{--wk:#2F55C8;--wk-soft:rgba(47,85,200,.10);--wk-d:#8AA6FF;--wk-soft-d:rgba(138,166,255,.14)}
.bars{display:grid;gap:6px;font-family:var(--f-display);font-size:.88rem}
.bars .b{display:grid;grid-template-columns:96px minmax(0,1fr) 48px;gap:8px;align-items:center}
.bars .track{height:16px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bars .fill{height:100%;background:var(--wk);transition:width .3s}
.bars .b.hit .fill{background:var(--warn)}
.bars .b.hit span:first-child{font-weight:700;color:var(--warn)}
.out{font-family:var(--f-body);font-size:1.05rem;padding:12px 14px;border-radius:8px;background:var(--bg);border:1px solid var(--line);min-height:3.2em}
.out em{font-style:normal;background:var(--mark);padding:0 3px;border-radius:3px}
.lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lane h4{font-size:.85rem;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.lane button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;margin-bottom:6px;cursor:pointer;font-family:var(--f-display);font-size:.86rem}
.lane button[aria-pressed="true"]{border-color:var(--wk);background:var(--wk-soft)}
.detail{margin-top:10px;font-family:var(--f-display);font-size:.92rem;border-top:1px solid var(--line);padding-top:10px}
.threats{display:grid;gap:6px}
.threats details{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 12px;font-family:var(--f-display);font-size:.92rem}
.threats summary{cursor:pointer;font-weight:600}
.threats p{margin:.4em 0 0}
.claim{display:inline;cursor:pointer;border-radius:3px;padding:1px 2px;border-bottom:1px dashed var(--line)}
.claim:hover{background:var(--sunk)}
.claim.flag{background:color-mix(in srgb,var(--bad) 18%,transparent);border-bottom-color:var(--bad)}
.claim.ok-shown{background:color-mix(in srgb,var(--good) 14%,transparent)}
.claim.bad-shown{background:color-mix(in srgb,var(--bad) 18%,transparent)}
.tutor{font-family:var(--f-body);line-height:1.75;padding:14px 16px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.tutor .who{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
.policy .item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-family:var(--f-display);font-size:.9rem}
.light{display:flex;gap:4px}
.light button{width:30px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-family:var(--f-mono);font-size:.7rem;font-weight:600}
.light button[data-c="R"][aria-pressed="true"]{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.light button[data-c="A"][aria-pressed="true"]{background:var(--warn);color:var(--surface);border-color:var(--warn)}
.light button[data-c="G"][aria-pressed="true"]{background:var(--good);color:var(--surface);border-color:var(--good)}
@media (max-width:560px){.lanes{grid-template-columns:minmax(0,1fr)}.bars .b{grid-template-columns:80px minmax(0,1fr) 42px}}
</style>

<body>
<script src="assets/course.js"></script>
<script>
const {W} = Lecture;

/* ---------- Scene 2: next-word widget ---------- */
function nextWord(el){
  const words=[['practice',.41],['review',.22],['understand',.14],['sleep',.08],['memorise',.07],['ask',.05],['panic',.03]];
  el.innerHTML=`<div class="stack ui">
    <div class="out" id="nw-out">Before the exam, the best way to study statistics is to <em>…</em></div>
    <div class="bars" id="nw-bars"></div>
    <label for="nw-t">Temperature (how adventurous the model is): <span id="nw-tv" class="mono">1.0</span></label>
    <input id="nw-t" type="range" min="0.2" max="2" step="0.1" value="1">
    <div class="row"><button class="btn" id="nw-go" type="button">Generate next word</button><span class="mono" id="nw-log"></span></div>
  </div>`;
  const bars=el.querySelector('#nw-bars'), t=el.querySelector('#nw-t'), log=el.querySelector('#nw-log'); let runs={};
  const dist=()=>{ const T=+t.value; const w=words.map(([k,p])=>[k,Math.pow(p,1/T)]); const s=w.reduce((a,[,p])=>a+p,0); return w.map(([k,p])=>[k,p/s]); };
  const draw=(hit)=>{ bars.innerHTML=dist().map(([k,p])=>`<div class="b ${k===hit?'hit':''}"><span>${k}</span><div class="track"><div class="fill" style="width:${(p*100).toFixed(1)}%"></div></div><span class="mono">${(p*100).toFixed(0)}%</span></div>`).join(''); };
  t.addEventListener('input',()=>{ el.querySelector('#nw-tv').textContent=(+t.value).toFixed(1); draw(); });
  el.querySelector('#nw-go').addEventListener('click',()=>{ const d=dist(); let r=Math.random(),pick=d[d.length-1][0]; for(const [k,p] of d){ if((r-=p)<=0){pick=k;break;} }
    el.querySelector('#nw-out').innerHTML=`Before the exam, the best way to study statistics is to <em>${pick}</em>`; runs[pick]=(runs[pick]||0)+1; draw(pick);
    log.textContent='Runs so far: '+Object.entries(runs).map(([k,v])=>k+' ×'+v).join(', '); });
  draw();
}

/* ---------- Scene 3: landscape ---------- */
const LAND={
 Students:[
  ['Personal tutor','Khan Academy launched <b>Khanmigo</b> in 2023, a GPT-4-based tutor designed to ask guiding questions instead of handing over answers. The design choice matters: a tutor that gives the answer saves time; a tutor that asks the next question builds understanding.'],
  ['Language practice','<b>Duolingo Max</b> (2023) added "Explain my answer" and role-play conversations powered by GPT-4. Learners practise speaking situations, such as ordering in a café, that a worksheet cannot simulate.'],
  ['Writing feedback','LLMs can comment on structure, clarity and grammar in seconds. The learning happens only if the student revises the text themselves.'],
  ['Accessibility','Text-to-speech, simplification and translation help students with reading difficulties or who study in a second language, which is the daily reality for many students in the UAE.']],
 Teachers:[
  ['Lesson preparation','Drafting examples, case studies, quiz questions and differentiated versions of the same task for different levels.'],
  ['Feedback at scale','First-pass comments on drafts, which the teacher checks and personalises. The teacher stays accountable for the grade.'],
  ['Admin load','Emails, rubrics, summaries of student questions. Time saved here can go back into contact with students.']],
 Institutions:[
  ['National curriculum','The UAE announced that AI would be taught as a subject across public schools, from kindergarten to Grade 12, starting in the 2025–26 academic year.'],
  ['Policy and integrity','Universities write rules on when AI use is allowed and how it must be declared. CUD checks assignments through Turnitin, with a maximum similarity index of 20%.'],
  ['Student support','24/7 chat assistants for admissions, registration and IT questions free staff for complex cases.']]
};
function landscape(el){
  el.innerHTML=`<div class="lanes">${Object.keys(LAND).map(k=>`<div class="lane"><h4>${k}</h4>${LAND[k].map((x,i)=>`<button type="button" data-k="${k}" data-i="${i}" aria-pressed="false">${x[0]}</button>`).join('')}</div>`).join('')}</div><div class="detail" id="ld">Select any use to see a real example.</div>`;
  el.querySelectorAll('.lane button').forEach(b=>b.addEventListener('click',()=>{ el.querySelectorAll('.lane button').forEach(x=>x.setAttribute('aria-pressed',x===b)); const [t,d]=LAND[b.dataset.k][+b.dataset.i]; el.querySelector('#ld').innerHTML=`<b>${t}</b> · <span class="tag">${b.dataset.k}</span><p style="margin:.4em 0 0">${d}</p>`; }));
  el.querySelector('.lane button').click();
}

/* ---------- Scene 4: Bloom 2-sigma curves ---------- */
function twoSigma(el){
  const Wd=560,H=250,pad=30, x0=-3.2,x1=5.2;
  const X=v=>pad+(v-x0)/(x1-x0)*(Wd-2*pad), Y=v=>H-40-v*420;
  const pdf=(x,m)=>Math.exp(-((x-m)**2)/2)/Math.sqrt(2*Math.PI);
  const path=(m)=>{ let d=''; for(let x=x0;x<=x1+1e-9;x+=0.05){ d+=(d?'L':'M')+X(x).toFixed(1)+','+Y(pdf(x,m)).toFixed(1);} return d; };
  const area=(m,from)=>{ let d=`M${X(from).toFixed(1)},${Y(0)}`; for(let x=from;x<=x1;x+=0.05) d+=`L${X(x).toFixed(1)},${Y(pdf(x,m)).toFixed(1)}`; return d+`L${X(x1)},${Y(0)}Z`; };
  let ticks=''; for(let s=-3;s<=5;s++){ ticks+=`<line x1="${X(s)}" x2="${X(s)}" y1="${Y(0)}" y2="${Y(0)+5}" stroke="var(--muted)"/><text x="${X(s)}" y="${Y(0)+19}" text-anchor="middle" font-size="11" class="t-muted t-mono">${s>0?'+':''}${s}σ</text>`; }
  el.innerHTML=`<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Two bell curves: the tutored group's distribution sits two standard deviations to the right of the conventional class">
    <path d="${area(0,2)}" fill="var(--wk-soft)" stroke="none"/>
    <path d="${path(0)}" fill="none" stroke="var(--muted)" stroke-width="2"/>
    <path d="${path(2)}" fill="none" stroke="var(--wk)" stroke-width="2.5"/>
    <line x1="${X(0)}" x2="${X(0)}" y1="${Y(pdf(0,0))}" y2="${Y(0)}" stroke="var(--muted)" stroke-dasharray="3 3"/>
    <line x1="${X(2)}" x2="${X(2)}" y1="${Y(pdf(0,0))}" y2="${Y(0)}" stroke="var(--wk)" stroke-dasharray="3 3"/>
    <line x1="${pad}" x2="${Wd-pad}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)"/>${ticks}
    <text x="${X(0)}" y="${Y(pdf(0,0))-10}" text-anchor="middle" font-size="12" class="t-muted">Conventional class</text>
    <text x="${X(2)}" y="${Y(pdf(0,0))-10}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--wk)" style="fill:var(--wk)">One-to-one tutoring</text>
    <text x="${X(3.4)}" y="${Y(0.06)}" font-size="11" class="t-muted">shaded: conventional students</text>
    <text x="${X(3.4)}" y="${Y(0.06)+14}" font-size="11" class="t-muted">above the tutored average ≈ 2%</text>
  </svg>`;
}

/* ---------- Scene 5: threats ---------- */
const THREATS=[
 ['Hallucination','The model writes fluent, confident text that is false, including invented references.','A student cites a journal article that does not exist.','Verify every fact and reference against a real source before using it.'],
 ['Academic integrity','Submitting AI-written work as your own misrepresents what you know.','An essay that the student cannot explain when asked in class.','Declare AI use; keep drafts; be ready to explain your own work.'],
 ['Over-reliance','"Cognitive offloading": letting the tool do the thinking that the task was designed to build.','Asking for the answer to every practice question before trying it.','Attempt first, then ask the AI to check or question your attempt.'],
 ['Bias','Models learn from internet text and reproduce its stereotypes and gaps, including weaker coverage of Arabic and regional content.','Career advice that differs by the gender of the name in the prompt.','Compare outputs, question defaults, use local sources.'],
 ['Privacy','Prompts may be stored and used to improve the product.','Pasting a classmate\'s personal details or graded work into a chatbot.','Never paste personal or confidential data; check the tool\'s data settings.'],
 ['Unequal access','Paid tiers are stronger than free ones, so ability to pay can turn into a grade advantage.','Some students use a paid model, others a free one.','Course activities use free tools; institutions consider licences for all.'],
 ['Unreliable detectors','AI-writing detectors produce false positives. A 2023 Stanford study (Liang et al.) found that detectors labelled more than half of essays written by non-native English speakers as AI-generated.','A student writing in their second language is accused unfairly.','Detector scores are never proof on their own; conversation and drafts matter more.']
];
function threats(el){
  el.innerHTML=`<div class="threats">${THREATS.map(([t,d,e,s],i)=>`<details ${i===0?'open':''}><summary>${t}</summary><p>${d}</p><p><span class="tag warn">Looks like</span> ${e}</p><p><span class="tag good">Safeguard</span> ${s}</p></details>`).join('')}</div>`;
}

/* ---------- Scene 7: fact-check the tutor ---------- */
const CLAIMS=[
 [0,'The term “artificial intelligence” was coined by Alan Turing at the Dartmouth workshop in 1950.','False. John McCarthy used the term in the 1955 proposal for the 1956 Dartmouth workshop. Turing\'s famous paper, “Computing Machinery and Intelligence”, appeared in 1950.'],
 [1,'In that paper Turing proposed the “imitation game”, which we now call the Turing Test.','Correct.'],
 [1,'Funding cuts in the 1970s, including those that followed the UK\'s Lighthill Report in 1973, contributed to the first “AI winter”.','Correct.'],
 [0,'Neural networks were invented in 2012, when AlexNet won the ImageNet competition.','False. Neural network ideas date to the 1940s–50s (McCulloch & Pitts 1943; Rosenblatt\'s perceptron 1958). AlexNet in 2012 was a breakthrough for deep learning, not the invention.'],
 [1,'In 1997 IBM\'s Deep Blue defeated world chess champion Garry Kasparov.','Correct.'],
 [0,'ChatGPT was released by Google in 2020 and reached 100 million users in its first week.','False twice. OpenAI released ChatGPT in November 2022. It reached an estimated 100 million users in about two months, not one week.']
];
function factCheck(el){
  el.innerHTML=`<div class="tutor"><span class="who">AI tutor · constructed example for this exercise</span>${CLAIMS.map((c,i)=>`<span class="claim" data-i="${i}" tabindex="0" role="button" aria-pressed="false">${c[1]}</span> `).join('')}</div>
   <div class="row ui" style="margin-top:12px"><span id="fc-n" class="mono">0 sentences flagged</span><button class="btn" id="fc-go" type="button">Check my flags</button></div><div id="fc-out" class="stack" style="margin-top:10px"></div>`;
  const cl=[...el.querySelectorAll('.claim')]; const n=el.querySelector('#fc-n');
  const tog=c=>{ c.classList.toggle('flag'); c.setAttribute('aria-pressed',c.classList.contains('flag')); n.textContent=el.querySelectorAll('.claim.flag').length+' sentences flagged'; };
  cl.forEach(c=>{ c.addEventListener('click',()=>tog(c)); c.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();tog(c);} }); });
  el.querySelector('#fc-go').addEventListener('click',()=>{ let right=0; const out=el.querySelector('#fc-out'); out.innerHTML='';
    cl.forEach((c,i)=>{ const ok=CLAIMS[i][0]===1, flagged=c.classList.contains('flag'); if(ok!==flagged) right++; c.classList.remove('flag'); c.classList.add(ok?'ok-shown':'bad-shown');
      if(!ok) out.insertAdjacentHTML('beforeend',`<div class="feedback"><span class="tag bad">Error</span> ${CLAIMS[i][2]}</div>`); });
    out.insertAdjacentHTML('afterbegin',`<div class="feedback"><b>${right} of ${cl.length}</b> sentences judged correctly. Three sentences contained errors. Notice how the false sentences sound exactly as confident as the true ones.</div>`);
  });
}

/* ---------- Scene 8: class AI policy ---------- */
const TASKS=['Brainstorming topic ideas for Assignment 2','Explaining a lecture concept I did not understand','Checking grammar and spelling of my final text','Writing paragraphs that I submit as my own','Summarising a reading I have not opened','Translating a source from Arabic or French to English','Generating a list of references','Making a quiz to test myself before the midterm'];
function policy(el){
  const st={};
  el.innerHTML=`<div class="policy ui">${TASKS.map((t,i)=>`<div class="item"><span>${t}</span><div class="light" data-i="${i}">${['G','A','R'].map(c=>`<button type="button" data-c="${c}" aria-pressed="false" aria-label="${{G:'Allowed',A:'Allowed with conditions',R:'Not allowed'}[c]}">${c}</button>`).join('')}</div></div>`).join('')}
   <p class="mono" style="margin:10px 0 4px">G = allowed · A = allowed if declared and checked · R = not allowed</p>
   <button class="btn" id="pol-go" type="button">Build our policy</button><div id="pol-out" style="margin-top:10px"></div></div>`;
  el.querySelectorAll('.light').forEach(g=>g.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ st[g.dataset.i]=b.dataset.c; g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b)); })));
  el.querySelector('#pol-go').addEventListener('click',()=>{
    const grp=c=>TASKS.filter((t,i)=>st[i]===c); const out=el.querySelector('#pol-out');
    const txt=`GED 102 class AI policy (draft)\n\nAllowed:\n${grp('G').map(t=>'- '+t).join('\n')||'- (none)'}\n\nAllowed if declared and checked:\n${grp('A').map(t=>'- '+t).join('\n')||'- (none)'}\n\nNot allowed:\n${grp('R').map(t=>'- '+t).join('\n')||'- (none)'}\n\nEvery use of AI is declared in a short note at the end of the submission.`;
    out.innerHTML=''; const ta=W.h('textarea',{rows:12,id:'pol-txt'}); ta.value=txt; out.appendChild(ta);
    const c=W.h('button',{class:'btn ghost',type:'button',style:'margin-top:6px'},'Copy policy'); c.addEventListener('click',()=>{ try{navigator.clipboard.writeText(txt).then(()=>c.textContent='Copied',()=>{ta.select();c.textContent='Select and copy the text above';});}catch(e){ta.select();} }); out.appendChild(c);
  });
}

/* ---------- Agenda figure ---------- */
function agenda(el, rows){
  const total=rows.reduce((a,r)=>a+r[1],0); let acc=0;
  el.innerHTML=`<div class="stack ui">${rows.map(([t,m,k])=>{ const s=acc; acc+=m; return `<div style="display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:8px;align-items:center"><div><div style="font-size:.86rem;margin-bottom:3px">${t}</div><div style="height:10px;background:var(--sunk);border-radius:3px;position:relative"><div style="position:absolute;left:${s/total*100}%;width:${m/total*100}%;top:0;bottom:0;border-radius:3px;background:${k==='a'?'var(--wk)':k==='b'?'var(--line)':k==='c'?'var(--good)':'var(--muted)'}"></div></div></div><span class="mono" style="text-align:right">${m}′</span></div>`; }).join('')}
   <div class="row mono" style="gap:14px;margin-top:4px"><span><i style="display:inline-block;width:10px;height:10px;background:var(--muted);border-radius:2px"></i> lecture</span><span><i style="display:inline-block;width:10px;height:10px;background:var(--wk);border-radius:2px"></i> activity</span><span><i style="display:inline-block;width:10px;height:10px;background:var(--good);border-radius:2px"></i> check</span><span>Total ${total} min</span></div></div>`;
}

Lecture.mount({
  id:'w5', week:5, clo:2, short:'Week 5 · Education and Learning',
  title:'Applications of AI: Education and Learning',
  meta:'TB Chapter 5 · 3-hour session',
  scenes:[
  { nav:'Start here', title:'AI is already in the classroom. Who is learning?', minutes:10,
    narration:[
     'Every student in this room has used, or been tempted to use, a chatbot for coursework. This week we look at that experience from the outside: what large language models actually do, where they help learning, where they quietly replace it, and what fair rules for using them might look like.',
     'Our syllabus topic, in its own words, is <strong>“The Incorporation of Large Language Models (LLMs) in the Field of Education: Ethical Possibilities, Threats, and Opportunities.”</strong> This connects to <strong>CLO 2</strong>: identify how AI technologies are applied in different aspects of daily life.',
     '<ul><li>Explain in plain words how an LLM produces text.</li><li>Give real examples of LLMs used by students, teachers and institutions.</li><li>Weigh the opportunities against the threats, with evidence.</li><li>Draft a fair AI-use policy for our own class.</li></ul>'],
    think:'How did you use AI in the last seven days for study? Write one honest sentence. You will come back to it at the end.',
    src:'Reading: Moutinho, L., Cavique, L., & Bigné, E. (2023). <em>Philosophy of artificial intelligence and its place in society</em>. IGI Global. Chapter 5.',
    notes:['Open with the honest-sentence prompt on the board; collect nothing yet.','Point out the Layout switch and Listen button: students can replay any scene at home.'],
    fig:{label:'Today\'s session · 180 minutes', build:el=>agenda(el,[['Start here',10,'l'],['Hook: human or machine?',10,'a'],['How an LLM writes',20,'l'],['Where LLMs show up',20,'l'],['Opportunities',15,'l'],['Break',10,'b'],['Threats',20,'l'],['Activity: help or replace?',15,'a'],['Activity: fact-check the tutor',20,'a'],['Activity: our class policy',25,'a'],['Exit check',15,'c']])} },

  { nav:'Human or machine?', title:'Can you tell who wrote it?', kind:'activity', minutes:10,
    narration:[
     'Two short answers to the same question: <em>“Why should university students study history?”</em> Read both, then vote for the one you think an AI wrote.',
     'Before you reveal the answer, say out loud what you based your vote on. Was it the vocabulary? The rhythm? A mistake? A “feeling”?'],
    think:'If you cannot reliably tell human from machine writing, what does that mean for how teachers should assess learning?',
    notes:['Show of hands first, then let students click.','Key point: the cues people trust (polish, structure, “too perfect”) are the same cues detectors use, and both are unreliable. This sets up the detector point in Scene 5.'],
    fig:{label:'Vote', build:el=>{
      el.innerHTML=`<div class="stack"><div class="tutor"><span class="who">Answer A</span>History trains us to ask who is telling the story and why. When we read a source from 1950, we learn to notice what it leaves out. That habit is useful every time we read the news, a contract, or a chatbot's answer.</div><div class="tutor"><span class="who">Answer B</span>Studying history is important for university students because it helps them understand the past, develop critical thinking skills, and become informed citizens. By learning about historical events, students can make better decisions in the future.</div></div><div style="margin-top:12px" id="pv"></div>`;
      W.poll(el.querySelector('#pv'),{q:'Which answer did an AI write?',opts:['Answer A','Answer B','Both','Neither'],reveal:i=>i===2?'<b>Right.</b> Both were generated by an AI model for this lecture. B sounds “typical”, A sounds “human”, and that is the trap: style is not evidence of authorship.':'<b>The answer is: both.</b> Both answers were generated by an AI model for this lecture. Most people pick B because it sounds generic. Style alone is not evidence of who wrote a text.'});
    }} },

  { nav:'How an LLM writes', title:'An LLM predicts the next word, then does it again', minutes:20,
    narration:[
     'A large language model is trained on a huge amount of text to do one job: given the words so far, estimate how likely each possible next word is. It picks one, adds it to the text, and repeats. A whole essay is thousands of these small predictions.',
     'Try it on the right. The bars are the model\'s probabilities for the next word. Press <strong>Generate</strong> several times. The same prompt does not always give the same answer, because the model <em>samples</em> from the probabilities.',
     'The <strong>temperature</strong> slider changes how adventurous the sampling is. Low temperature: almost always the top word, safe and repetitive. High temperature: rare words get a real chance, more creative and more likely to go wrong.',
     'Two things follow for education. First, the model is optimised to sound <em>likely</em>, not to be <em>true</em>. Second, there is no “answer key” inside it; a fluent wrong answer and a fluent right answer come from the same process.'],
    think:'If the model only predicts likely words, why does it so often get facts right? And why does it sometimes get them confidently wrong?',
    notes:['Run Generate 8–10 times at temperature 1.0 and tally on the board, then repeat at 0.2 and 2.0.','Probabilities are illustrative, not taken from a real model. Say so if asked.','Link back to Week 3 (“How AI thinks: smart tools, not magic”).'],
    fig:{label:'Next-word prediction · illustrative probabilities', build:nextWord, caption:'Probabilities are made up for teaching. Real models choose among tens of thousands of possible tokens.'} },

  { nav:'Where LLMs show up', title:'Three places LLMs enter education', minutes:20,
    narration:[
     'LLMs reach learning through three doors. <strong>Students</strong> use them as tutors, writing assistants and language partners. <strong>Teachers</strong> use them to prepare materials and give feedback faster. <strong>Institutions</strong> set curricula and integrity rules, and run support services.',
     'Click through the examples on the right. They are real products and policies, and each has a design choice worth noticing. Khanmigo, for example, was built to ask students questions rather than give answers.',
     'Closer to home, the UAE announced that AI would become a subject in public schools from kindergarten to Grade 12, starting in the 2025–26 academic year. The students you will hire, teach or work beside in a few years will have studied AI since childhood.'],
    think:'Which of these uses have you seen at CUD? Which one would you add?',
    notes:['Ask pairs to pick one example and decide: does it make the student do more thinking or less?','Optional: students open Khanmigo or Duolingo pages on their phones (no account needed to read about them).'],
    fig:{label:'Students · Teachers · Institutions', build:landscape} },

  { nav:'Opportunities', title:'The promise: a tutor for every student', minutes:15,
    narration:[
     'In 1984 the educational psychologist Benjamin Bloom reported a striking result. Students taught one-to-one by a tutor performed about <strong>two standard deviations</strong> better than students taught in a conventional class. The average tutored student scored above roughly 98% of the conventional class. He called it the “2 sigma problem”: one-to-one tutoring works, but no society can afford a human tutor for every learner.',
     'This is the strongest argument for LLMs in education. They offer something like a tutor that is available at 2 a.m., never gets tired of the same question, and can explain in Arabic, English or French.',
     '<ul><li><strong>Personalisation:</strong> explanations pitched at the learner\'s level.</li><li><strong>Immediate feedback</strong> on practice, not two weeks later.</li><li><strong>Accessibility:</strong> reading support, translation, speech.</li><li><strong>Teacher time</strong> moved from paperwork to people.</li></ul>',
     'A statistics caution: later studies of tutoring usually find smaller effects than Bloom\'s two sigma. The gains are real but more modest, and they depend on how the tutoring is designed.'],
    think:'What is the difference between a tutor who explains and a tutor who answers? Which one did Bloom study?',
    src:'Bloom, B. S. (1984). The 2 sigma problem. <em>Educational Researcher</em>, 13(6), 4–16.',
    notes:['Statistics bridge: students who took MTH 105 can read σ as “standard deviation”. Others: “two big steps up the class ranking”.'],
    fig:{label:'Bloom\'s 2-sigma result · normal curves', build:twoSigma, caption:'Each curve shows how test scores are spread. The tutored curve sits two standard deviations to the right.'} },

  { nav:'Threats', title:'The threats: what can go wrong', minutes:20,
    narration:[
     'Every opportunity on the previous scene has a shadow. Open each threat on the right to see what it looks like in practice and one safeguard that reduces it.',
     'Two threats deserve extra attention. <strong>Over-reliance</strong> is quiet: you still get the grade, but the skill the task was meant to build never forms. And <strong>unreliable detectors</strong> can turn an integrity policy into an injustice. A 2023 Stanford study found that AI detectors flagged more than half of essays written by non-native English speakers as AI-generated.',
     'That second point matters in a university where most students write in their second or third language.'],
    think:'Which threat worries you most as a student? Which one would worry you most as a teacher? Are they the same?',
    src:'Liang, W., Yuksekgonul, M., Mao, Y., Wu, E., & Zou, J. (2023). GPT detectors are biased against non-native English writers. <em>Patterns</em>, 4(7).',
    notes:['Take a quick poll: “student worry” vs “teacher worry”. Differences make good discussion.','Connect privacy to Week 12 and bias to Week 10 so students see the course arc.'],
    fig:{label:'Seven threats · open each one', build:threats} },

  { nav:'Help or replace?', title:'Activity 1 · Does it help learning or replace it?', kind:'activity', minutes:15,
    narration:[
     'In pairs, sort each use of AI into one of three groups. There is room for disagreement; the point is the reasoning.',
     '<strong>Supports learning</strong>: you do more of the thinking. <strong>Replaces learning</strong>: the tool does the thinking the task was meant to build. <strong>Depends how</strong>: the same tool can go either way.',
     'When you have sorted all of them, reveal the suggested answers and discuss any where your pair disagrees.'],
    notes:['10 min pairs, 5 min whole-class on the two most disputed items.','Expect debate on translation and summarising; both are “depends how”.'],
    fig:{label:'Sort the uses', build:el=>W.sort(el,{buckets:['Supports','Replaces','Depends how'],items:[
      {t:'Asking a chatbot to quiz me on this week\'s reading',a:0,why:'Retrieval practice is one of the best-evidenced study methods.'},
      {t:'Pasting the assignment question and submitting the output',a:1,why:'The tool did all the thinking, and it is an integrity violation.'},
      {t:'Asking it to explain a concept a second way after the lecture',a:0,why:'Like asking a classmate. You still have to make sense of it.'},
      {t:'Using it to summarise a reading I have not opened',a:1,why:'You lose the reading itself, and summaries can be wrong.'},
      {t:'Translating a French source into English for my essay',a:2,why:'Helpful for access; check key passages and cite the original.'},
      {t:'Getting feedback on the structure of my own draft',a:0,why:'You keep authorship and improve through revision.'},
      {t:'Having it rewrite my paragraphs “to sound better”',a:2,why:'Light edits help; full rewrites replace your voice and argument.'},
      {t:'Asking it to solve a statistics problem before I try',a:1,why:'Attempt first. Ask for a hint, not the solution.'}]})} },

  { nav:'Fact-check the tutor', title:'Activity 2 · Fact-check the AI tutor', kind:'activity', minutes:20,
    narration:[
     'Here is an AI tutor\'s answer to the question “Summarise the history of AI in six sentences.” Some sentences are true and some are false. This is also revision for Week 2 and the midterm.',
     'Click every sentence you think is wrong. Use your Week 2 notes, the reading, or a quick search. Then press <strong>Check my flags</strong>.',
     'Notice how the false sentences sound exactly as confident as the true ones. That is what hallucination looks like in practice: no warning sign in the text itself.'],
    think:'What did you use to check each claim? Which of those sources would you trust in an assignment?',
    notes:['Constructed example written for this exercise; it is not output from a specific product.','Groups of three; one person reads, one searches, one records. 12 min work, 8 min debrief.'],
    fig:{label:'Click the sentences you think are false', build:factCheck} },

  { nav:'Our class policy', title:'Activity 3 · Write our class AI policy', kind:'activity', minutes:25,
    narration:[
     'UNESCO\'s 2023 <em>Guidance for generative AI in education and research</em> asks schools and universities to keep humans in charge of learning, protect student data, check tools before using them, and set a minimum age for classroom use (it suggests 13).',
     'Now it is our turn. For each task, decide as a group: <strong>G</strong> allowed, <strong>A</strong> allowed only if declared and checked, or <strong>R</strong> not allowed. Then press <strong>Build our policy</strong>.',
     'Keep in mind the university rules that already apply: the CUD academic integrity policy, and the 20% maximum similarity index for assignments submitted through Turnitin.'],
    think:'A good rule is one you would still accept if you were the teacher. Does your policy pass that test?',
    src:'UNESCO (2023). <em>Guidance for generative AI in education and research</em>. Paris: UNESCO.',
    notes:['Groups build a policy, then two groups compare and merge.','Use the merged version as the agreed AI-use statement for Assignment 2 (due Week 7).'],
    fig:{label:'Traffic-light policy builder', build:policy} },

  { nav:'Exit check', title:'Exit check', kind:'check', minutes:15,
    narration:[
     'Six questions on today\'s ideas. Answer on your own first; feedback appears after each choice.',
     'Then return to the sentence you wrote at the start about your own AI use. Would you change anything about how you use it next week?',
     '<strong>Before Week 6:</strong> read TB Chapter 3, <em>Artificial Intelligence in Healthcare</em>. Start thinking about which field you will choose for Assignment 2, “AI in my world”.'],
    fig:{label:'Six questions', build:el=>W.quiz(el,[
      {q:'At its core, what does a large language model do when it writes?',o:['Looks up the answer in a database of facts','Predicts a likely next word, again and again','Copies the closest matching web page','Follows rules written by teachers'],a:1,why:'It generates text one token at a time from learned probabilities.'},
      {q:'Raising the “temperature” makes a model’s output…',o:['more accurate','faster','more varied and less predictable','shorter'],a:2,why:'Higher temperature gives less likely words a bigger chance.'},
      {q:'Bloom’s “2 sigma problem” refers to the finding that…',o:['AI tutors outperform human tutors','one-to-one tutoring produced much higher scores than conventional classes','online learning halves exam scores','two teachers per class double learning'],a:1,why:'Tutored students scored about two standard deviations higher (Bloom, 1984).'},
      {q:'Why are AI-writing detectors a fairness concern at a university like CUD?',o:['They are too expensive','They can flag non-native English writers as AI at high rates','They only work in Arabic','They are always correct'],a:1,why:'Liang et al. (2023) found high false-positive rates for non-native English writing.'},
      {q:'Which use is most likely to replace learning rather than support it?',o:['Quizzing yourself on a reading','Asking for a second explanation of a concept','Getting the solution before attempting the problem','Feedback on the structure of your own draft'],a:2,why:'Attempt first; otherwise the tool does the thinking the task was built to develop.'},
      {q:'An AI tutor gives a confident answer with a reference. What should you do first?',o:['Use it, since it gave a reference','Check that the reference exists and says what is claimed','Ask the AI if it is sure','Remove the reference'],a:1,why:'Hallucinated references look real. Verify against the original source.'}])} }
  ]
