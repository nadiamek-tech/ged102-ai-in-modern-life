:root{--wk:#0B7F6A;--wk-soft:rgba(11,127,106,.10);--wk-d:#4FD1B0;--wk-soft-d:rgba(79,209,176,.14)}
.journey{display:flex;flex-wrap:wrap;gap:6px}
.journey button{flex:1 1 120px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;cursor:pointer;font-family:var(--f-display);font-size:.86rem;text-align:left;position:relative}
.journey button small{display:block;font-family:var(--f-mono);font-size:.66rem;color:var(--muted);letter-spacing:.06em}

.jd .ex{border-left:3px solid var(--wk);padding:2px 0 2px 12px}

.cases{display:grid;gap:8px}
.cases details{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:10px 12px;font-family:var(--f-display);font-size:.92rem}
.cases summary{cursor:pointer;font-weight:650}
.cases p{margin:.45em 0 0}
.resp .r{display:grid;grid-template-columns:120px minmax(0,1fr) 44px;gap:10px;align-items:center;font-family:var(--f-display);font-size:.9rem;margin-bottom:6px}
.stackbar{display:flex;height:26px;border-radius:6px;overflow:hidden;margin-top:12px;border:1px solid var(--line)}
.stackbar div{transition:width .2s;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:.66rem;color:var(--surface);overflow:hidden;white-space:nowrap}
@media (max-width:560px){.stat{grid-template-columns:repeat(2,minmax(0,1fr))}.resp .r{grid-template-columns:90px minmax(0,1fr) 40px}}

<script>
const {W} = Lecture;

function agenda(el, rows){
  const total=rows.reduce((a,r)=>a+r[1],0); let acc=0;
  el.innerHTML=`<div class="stack ui">${rows.map(([t,m,k])=>{ const s=acc; acc+=m; return `<div style="display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:8px;align-items:center"><div><div style="font-size:.86rem;margin-bottom:3px">${t}</div><div style="height:10px;background:var(--sunk);border-radius:3px;position:relative"><div style="position:absolute;left:${s/total*100}%;width:${m/total*100}%;top:0;bottom:0;border-radius:3px;background:${k==='a'?'var(--wk)':k==='b'?'var(--line)':k==='c'?'var(--good)':'var(--muted)'}"></div></div></div><span class="mono" style="text-align:right">${m}′</span></div>`; }).join('')}
   <div class="row mono" style="gap:14px;margin-top:4px"><span><i style="display:inline-block;width:10px;height:10px;background:var(--muted);border-radius:2px"></i> lecture</span><span><i style="display:inline-block;width:10px;height:10px;background:var(--wk);border-radius:2px"></i> activity</span><span><i style="display:inline-block;width:10px;height:10px;background:var(--good);border-radius:2px"></i> check</span><span>Total ${total} min</span></div></div>`;
}

/* ---------- patient journey ---------- */
const STAGES=[
 ['Screening','prevent',[
   ['Breast cancer screening, Sweden','In the MASAI randomised trial (Lancet Oncology, 2023), AI-supported mammography screening detected 20% more cancers than standard double reading by two radiologists, and cut radiologists\' screen-reading workload by 44%.'],
   ['Diabetic eye disease','In 2018 the US FDA authorised IDx-DR, the first autonomous AI diagnostic system: it screens retinal photos for diabetic retinopathy without a specialist reading the image.']]],
 ['Diagnosis','detect',[
   ['Medical imaging','Most AI-enabled medical devices authorised by the US FDA are in radiology: X-ray, CT, MRI and mammography. Image reading is where AI in medicine is most mature.'],
   ['Skin and pathology','Models classify skin lesions and tissue slides. Their accuracy depends heavily on whether the training images represent all skin tones and populations.']]],
 ['Treatment','decide',[
   ['Planning support','AI helps outline organs on scans for radiotherapy planning and suggests options drawn from guidelines. The clinician makes the decision.'],
   ['Drug interactions','Decision-support systems warn prescribers about dangerous combinations, a long-standing and less glamorous form of AI.'],
   ['Surgery support','Robotic systems help surgeons be steadier and more precise. The surgeon controls the robot: it is a human-controlled tool, not an autonomous doctor.']]],
 ['Monitoring','follow',[
   ['Wearables','The Apple Heart Study (NEJM, 2019) enrolled more than 400,000 participants to test whether a smartwatch could flag irregular heart rhythm. Only a small share received alerts, and the study showed both the promise and the follow-up burden.'],
   ['Hospital early warning','Models watch vital signs to predict deterioration, such as sepsis. These are useful only if validated in the hospital where they are used (see the case in Scene 7).']]],
 ['Operations','run',[
   ['AI scribes','“Ambient” documentation tools listen to a consultation and draft the clinical note for the doctor to check, returning time to the patient.'],
   ['Connected records, Abu Dhabi','Malaffi, Abu Dhabi\'s health information exchange, links patient records across hospitals and clinics. Shared, well-governed data is the foundation every health AI depends on.']]],
 ['Research','discover',[
   ['Protein structures','DeepMind\'s AlphaFold predicted the 3D structures of more than 200 million proteins. Demis Hassabis and John Jumper shared the 2024 Nobel Prize in Chemistry for this work.'],
   ['Genomics, UAE','The Emirati Genome Programme sequences citizens\' genomes to support preventive and personalised medicine. AI is needed to find patterns in data of that size.']]]
];
function journey(el){
  el.innerHTML=`<div class="journey">${STAGES.map((s,i)=>`<button type="button" data-i="${i}" aria-pressed="false"><small>${String(i+1).padStart(2,'0')} · ${s[1]}</small>${s[0]}</button>`).join('')}</div><div class="jd" id="jd"></div>`;
  const bs=el.querySelectorAll('.journey button');
  bs.forEach(b=>b.addEventListener('click',()=>{ bs.forEach(x=>x.setAttribute('aria-pressed',x===b)); el.querySelector('#jd').innerHTML=STAGES[+b.dataset.i][2].map(([t,d])=>`<div class="ex"><b>${t}</b>${d}</div>`).join(''); }));
  bs[0].click();
}

/* ---------- how a model learns (static svg) ---------- */
const PIPE=`<svg viewBox="0 0 600 300" role="img" aria-label="Training: labelled scans feed a model. Use: a new scan gets a probability, a threshold turns it into a flag, and a doctor makes the decision.">
 <text x="10" y="18" font-size="11" class="t-muted t-mono">1 · TRAINING (once, on past data)</text>
 <g>${[0,1,2,3].map(i=>`<rect x="${14+i*7}" y="${34+i*7}" width="78" height="62" rx="6" fill="var(--sunk)" stroke="var(--line)"/>`).join('')}
 <text x="72" y="140" text-anchor="middle" font-size="12">Thousands of scans</text>
 <text x="72" y="155" text-anchor="middle" font-size="11" class="t-muted">each labelled by experts</text></g>
 <path d="M140 80 H215" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
 <rect x="222" y="44" width="130" height="72" rx="10" fill="var(--wk-soft)" stroke="var(--wk)" stroke-width="1.5"/>
 <text x="287" y="76" text-anchor="middle" font-size="14" font-weight="700">Model</text>
 <text x="287" y="95" text-anchor="middle" font-size="11" class="t-muted">learns patterns</text>
 <line x1="10" x2="590" y1="182" y2="182" stroke="var(--line)" stroke-dasharray="4 4"/>
 <text x="10" y="202" font-size="11" class="t-muted t-mono">2 · USE (every new patient)</text>
 <rect x="14" y="214" width="78" height="62" rx="6" fill="var(--sunk)" stroke="var(--line)"/>
 <text x="53" y="292" text-anchor="middle" font-size="11">New scan</text>
 <path d="M98 245 H130 Q287 245 287 125" fill="none" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="0"/>
 <path d="M352 80 Q410 80 410 210" fill="none" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
 <rect x="360" y="214" width="100" height="62" rx="8" fill="var(--surface)" stroke="var(--line)"/>
 <text x="410" y="242" text-anchor="middle" font-size="18" font-weight="700" class="t-mono">0.72</text>
 <text x="410" y="262" text-anchor="middle" font-size="10" class="t-muted">score: likely disease</text>
 <path d="M462 245 H486" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
 <rect x="492" y="214" width="98" height="62" rx="8" fill="var(--surface)" stroke="var(--wk)" stroke-width="1.5"/>
 <text x="541" y="238" text-anchor="middle" font-size="11">score ≥ threshold</text>
 <text x="541" y="256" text-anchor="middle" font-size="12" font-weight="700">→ flag</text>
 <text x="541" y="270" text-anchor="middle" font-size="10" class="t-muted">doctor decides</text>
 <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
</svg>`;

/* ---------- threshold explorer ---------- */
// 40 illustrative patients: [AI score, actually has disease]
const PTS=[[.04,0],[.07,0],[.09,0],[.11,0],[.13,0],[.15,0],[.17,0],[.19,0],[.21,0],[.22,1],[.24,0],[.26,0],[.28,0],[.31,0],[.33,0],[.35,0],[.37,1],[.39,0],[.42,0],[.44,0],[.46,0],[.48,1],[.51,0],[.53,0],[.56,1],[.58,0],[.61,0],[.63,1],[.66,1],[.68,0],[.71,1],[.74,1],[.77,0],[.8,1],[.83,1],[.86,1],[.9,1],[.93,0],[.95,1],[.97,1]];
function threshold(el){
  el.innerHTML=`<div class="ui stack"><svg viewBox="0 0 600 150" id="th-svg" role="img" aria-label="Forty patients placed by AI score from 0 to 1, with a movable threshold line"></svg>
   <label for="th">Threshold: flag a patient if the AI score is at least <span class="mono" id="thv">0.50</span></label>
   <input id="th" type="range" min="0.05" max="0.95" step="0.01" value="0.5">
   <div class="stat" id="th-stat"></div><div class="feedback" id="th-msg"></div></div>`;
  const svg=el.querySelector('#th-svg'), s=el.querySelector('#th');
  const X=v=>30+v*540;
  const draw=()=>{ const t=+s.value; el.querySelector('#thv').textContent=t.toFixed(2);
    let TP=0,FN=0,FP=0,TN=0; let dots='';
    PTS.forEach(([v,d],i)=>{ const flag=v>=t; if(d&&flag)TP++; else if(d)FN++; else if(flag)FP++; else TN++;
      const y=d?44:96; dots+= d?`<circle cx="${X(v)}" cy="${y}" r="8" fill="var(--bad)" opacity="${flag?1:.45}"/>${!flag?`<circle cx="${X(v)}" cy="${y}" r="12" fill="none" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="2 2"/>`:''}`
                 : `<circle cx="${X(v)}" cy="${y}" r="8" fill="${flag?'var(--warn)':'var(--muted)'}" opacity="${flag?1:.4}"/>`; });
    svg.innerHTML=`<rect x="${X(t)}" y="18" width="${X(1)-X(t)}" height="104" fill="var(--wk-soft)"/>
     <text x="0" y="48" font-size="11" class="t-muted">sick</text><text x="0" y="100" font-size="11" class="t-muted">well</text>
     ${dots}<line x1="${X(t)}" x2="${X(t)}" y1="14" y2="126" stroke="var(--wk)" stroke-width="2.5"/>
     <text x="${Math.min(X(t)+6,520)}" y="14" font-size="11" font-weight="700" style="fill:var(--wk)">flagged →</text>
     <line x1="${X(0)}" x2="${X(1)}" y1="130" y2="130" stroke="var(--line)"/>
     ${[0,.25,.5,.75,1].map(v=>`<text x="${X(v)}" y="145" font-size="10" text-anchor="middle" class="t-muted t-mono">${v}</text>`).join('')}`;
    const sens=TP/(TP+FN), spec=TN/(TN+FP);
    el.querySelector('#th-stat').innerHTML=`<div><b>${TP}</b><span>sick, caught</span></div><div><b style="color:var(--bad)">${FN}</b><span>sick, missed</span></div><div><b style="color:var(--warn)">${FP}</b><span>false alarms</span></div><div><b>${TN}</b><span>well, cleared</span></div>`;
    el.querySelector('#th-msg').innerHTML=`<b>Sensitivity ${(sens*100).toFixed(0)}%</b> (share of sick patients caught) · <b>Specificity ${(spec*100).toFixed(0)}%</b> (share of well patients cleared). ${FN===0?'No one sick is missed, but look at the false alarms.':FP===0?'No false alarms, but sick patients are going home.':'Moving the line trades missed cases for false alarms.'}`; };
  s.addEventListener('input',draw); draw();
}

/* ---------- responsibility ---------- */
function responsibility(el){
  const who=[['Developer','var(--wk)',30],['Hospital','var(--warn)',25],['Doctor','var(--bad)',30],['Regulator','var(--muted)',15]];
  el.innerHTML=`<div class="ui"><div class="tutor" style="font-family:var(--f-body);padding:12px 14px;background:var(--bg);border:1px solid var(--line);border-radius:10px;margin-bottom:12px"><span class="mono" style="display:block;color:var(--muted);margin-bottom:4px">CASE · FICTIONAL</span>A hospital uses an approved AI tool to pre-read chest X-rays. The tool marks Mr. Haddad's scan “low risk”. The radiologist, with 60 scans waiting, signs off without a close look. Six months later he is diagnosed with lung cancer that was visible on the original scan. The tool was trained mostly on scans from a different country and older machines.</div>
   <div class="resp">${who.map(([n,c,v],i)=>`<div class="r"><label for="rs${i}">${n}</label><input type="range" id="rs${i}" min="0" max="100" value="${v}"><span class="mono" id="rv${i}"></span></div>`).join('')}</div>
   <div class="stackbar" id="sb"></div><p class="mono" style="color:var(--muted);margin:6px 0 0">Shares are normalised to 100%.</p></div>`;
  const upd=()=>{ const v=who.map((w,i)=>+el.querySelector('#rs'+i).value); const s=v.reduce((a,b)=>a+b,0)||1;
    el.querySelector('#sb').innerHTML=who.map((w,i)=>`<div style="width:${v[i]/s*100}%;background:${w[1]}">${v[i]/s>.1?w[0]:''}</div>`).join('');
    who.forEach((w,i)=>el.querySelector('#rv'+i).textContent=Math.round(v[i]/s*100)+'%'); };
  el.querySelectorAll('input').forEach(i=>i.addEventListener('input',upd)); upd();
}

const CASES=[
 ['A hidden proxy: cost instead of need','Obermeyer et al., Science (2019)','A widely used US algorithm decided which patients got extra care by predicting future healthcare <em>costs</em>. Because less money had historically been spent on Black patients with the same level of illness, the algorithm judged them healthier than they were. Correcting it would have raised the share of Black patients selected for extra help from 17.7% to 46.5%.','The bias was not in a “race” variable. It was in the choice of what to predict.'],
 ['A sepsis alarm that missed most sepsis','Wong et al., JAMA Internal Medicine (2021)','An external check of a proprietary sepsis-prediction model used in many US hospitals found it missed about two-thirds of patients who developed sepsis, while alerting on many who did not.','A model that works where it was built may not work where it is used. Local validation matters.'],
 ['Who is in the training images?','Dermatology AI, multiple studies','Public skin-image datasets contain few images of darker skin tones. A model can score well overall and still perform worse for the patients least represented in its data.','Ask “accurate for whom?” as well as “how accurate?”'],
 ['Automation bias','A human factor','When people work with an automated aid, they tend to over-trust it, especially when tired or busy. A tool meant as a second reader can quietly become the only reader.','Workflow design, workload and training are part of AI safety.']
];
function cases(el){ el.innerHTML=`<div class="cases">${CASES.map(([t,s,d,l],i)=>`<details ${i===0?'open':''}><summary>${t}</summary><p class="mono" style="color:var(--muted)">${s}</p><p>${d}</p><p><span class="tag good">Lesson</span> ${l}</p></details>`).join('')}</div>`; }

const B=Lecture.B;
const tiles=(rows)=>`<div style="display:grid;grid-template-columns:repeat(${rows.length},minmax(0,1fr));gap:8px">${rows.map(([n,t])=>`<div style="border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg)"><div style="font-family:var(--f-display);font-weight:800;font-size:1.8rem;color:var(--wk);line-height:1">${n}</div><div style="font-family:var(--f-display);font-size:.84rem;margin-top:6px">${t}</div></div>`).join('')}</div>`;
const BR=`<table class="tbl"><thead><tr><th>Benefits</th><th>Risks</th></tr></thead><tbody>
<tr><td>Earlier detection of disease</td><td>Wrong diagnosis (false negative or false positive)</td></tr>
<tr><td>Faster results, less waiting</td><td>Bias if training data misses some groups</td></tr>
<tr><td>Access in places with few specialists</td><td>Patient data privacy and misuse</td></tr>
<tr><td>Less admin work for clinicians</td><td>Unclear who is responsible when AI is wrong</td></tr>
<tr><td>Faster, cheaper drug research</td><td>Doctors trusting the AI too much (automation bias)</td></tr></tbody></table>`;
const OTHER=[
 {t:`A hidden proxy: cost instead of need`,s:`Obermeyer et al., Science (2019)`,d:`A widely used US algorithm chose patients for extra care by predicting future healthcare <em>costs</em>. Less money had historically been spent on Black patients with the same illness, so the algorithm judged them healthier than they were. Correcting it would have raised the share of Black patients selected for extra help from 17.7% to 46.5%.`,l:`The bias was in the choice of what to predict.`},
 {t:`Who is in the training images?`,s:`Dermatology AI`,d:`A skin-cancer app trained mostly on images of light skin may miss cancers on dark skin. A model can score well overall and still fail the patients least represented in its data.`,l:`Ask “accurate for whom?” as well as “how accurate?”. Fix: diverse data and testing across groups.`},
 {t:`Automation bias`,s:`A human factor`,d:`Busy, tired people tend to over-trust an automated aid. A tool meant as a second reader can quietly become the only reader.`,l:`Workflow, workload and training are part of AI safety.`}];

/* ---------- figures and videos kept from the original lecture ---------- */
const FIG={
 'Who reads your scan?':{label:`Vote`, build:el=>W.poll(el,{q:`Your scan should be read by…`,opts:[`A doctor alone`,`The AI alone`,`The AI plus a doctor`,`It depends on the evidence`],reveal:i=>`${[`Many patients feel this way. Doctors also miss things, especially when tired.`,`Few health systems allow fully autonomous reading, and most patients are uncomfortable with it.`,`This is how most systems use AI today: as a second reader.`,`A scientist's answer.`][i]}<br><br><b>Evidence:</b> in the Swedish MASAI trial (Lancet Oncology, 2023), AI-supported screening found 20% more cancers than two radiologists reading independently, and cut radiologists' reading workload by 44%.`})},
 'Where AI is used':{label:`Six stages · click each`, build:journey},
 'Diagnostics':{flow:[{t:'Capture',s:'camera or scanner',d:'A camera or scanner takes the image.'},{t:'Model',s:'AI scores it',d:'The trained model gives the image a score.'},{t:'Confidence',s:'“92% likely disease”',d:'A threshold turns the score into a flag.'},{t:'Human check',s:'clinician reviews',d:'A qualified clinician reviews the flagged cases.'},{t:'Action',s:'refer · treat · monitor',d:'The human decides what happens next: human-in-the-loop.'}],label:`Train once · use many times · human decides`, html:PIPE},
 'Set the threshold':{label:`40 illustrative patients`, build:threshold},
 'Drugs and personalised care':{label:'From target to medicine', flow:[{t:'Disease target',s:'what to block',d:'Scientists choose the protein or process a drug should act on.'},{t:'AI predicts',s:'likely molecules',d:'Models such as AlphaFold-style structure prediction help guess which molecules could fit.'},{t:'Shortlist',s:'the best 20 keys',d:'Only the most promising candidates go forward.'},{t:'Lab tests',s:'check reality',d:'Experiments test whether the predictions hold.'},{t:'Clinical trials',s:'test in people',d:'Humans and regulators decide whether the drug is safe and works.'}]},
 'Case: sepsis model':{label:`External test · Michigan Medicine`, build:el=>{ el.innerHTML=tiles([['33%','of sepsis patients caught: it missed about two out of three'],['18%','of ALL hospitalised patients triggered an alert'],['Black box','hospitals could not inspect how it worked']])+'<div id="oc" style="margin-top:12px"></div>'; W.accordion(el.querySelector('#oc'),OTHER); }},
 'Who is responsible?':{label:`Divide the responsibility`, build:responsibility},
 'Exam takeaways':{mindmap:{center:'AI in healthcare',branches:[{t:'Uses',items:['Diagnosis · treatment','Drug discovery · patient care','Hospital operations']},{t:'Diagnostics',items:['Supervised learning + CNN','IDx-DR (2018)','MASAI: 20% more cancers found']},{t:'Errors',items:['False positive: false alarm','False negative: missed disease','Threshold = trade-off']},{t:'Sepsis case',items:['Missed 67% of cases','Alerts on 18% of patients','Alert fatigue']},{t:'Ethics pillars',items:['Privacy · bias','Accountability · explainability']},{t:'Human-in-the-loop',items:['AI suggests','Clinician decides']}]},label:`The week as a mind map · then likely exam questions`, build:el=>W.practice(el,[
      {q:`Explain how AI helps diagnose disease. Give an example.`,hint:`Supervised learning on labelled images (CNN) → score → human check; IDx-DR or MASAI.`},
      {q:`What is human-in-the-loop and why does it matter?`,hint:`AI suggests, a qualified human decides; handles unusual cases, explains, stays accountable.`},
      {q:`Discuss two risks of AI in healthcare.`,hint:`e.g. false negatives, bias in training data, privacy, automation bias; give an example each.`},
      {q:`What lesson does the sepsis model teach?`,hint:`Validate externally on local patients; transparency; alert fatigue from false alarms; human oversight.`}])},
 'Exit check':{label:`Six questions`, build:el=>W.quiz(el,[
      {q:`A false negative in medical AI means…`,o:[`a false alarm on a healthy patient`,`a real disease that the AI missed`,`a slow result`,`a refused scan`],a:1,why:`Missed disease: the more dangerous error.`},
      {q:`Diagnostic image AI is usually trained by…`,o:[`unsupervised learning on unlabelled scans`,`supervised learning on labelled scans`,`reinforcement learning with rewards`,`hand-written rules only`],a:1,why:`Experts label each scan; a CNN learns the patterns.`},
      {q:`“Human-in-the-loop” means…`,o:[`a human builds the computer`,`AI suggests and a qualified human decides`,`humans are replaced`,`patients train the AI`],a:1,why:`The clinician stays responsible.`},
      {q:`In the external test of the Epic Sepsis Model, it…`,o:[`caught every case`,`missed about two-thirds of sepsis cases and alerted on 18% of all patients`,`was never used`,`was fully transparent`],a:1,why:`Wong et al. (2021). The vendor disputes the study.`},
      {q:`“Alert fatigue” happens when…`,o:[`doctors work long shifts`,`too many false alarms make staff ignore alerts`,`the AI runs out of power`,`patients ignore reminders`],a:1,why:`Over-alerting erodes trust.`},
      {q:`AlphaFold is famous for…`,o:[`reading X-rays`,`predicting 3D protein structures`,`writing doctors' notes`,`robotic surgery`],a:1,why:`Its creators shared the 2024 Nobel Prize in Chemistry.`}])}
};
const V={
 'Drugs and personalised care':{id:'gg7WjuFs8F4',title:'AlphaFold: The making of a scientific breakthrough',by:'Google DeepMind',why:'How the team behind AlphaFold cracked protein structure prediction.'}
};

Lecture.mount({
  id:'w6', week:6, clo:2, short:'Week 6 · AI in Healthcare',
  title:'Applications of AI: AI in Healthcare',
  meta:'TB Chapter 3 · 3 hours',
  scenes:[
  { part:1, nav:'Who reads your scan?', title:'Who should read your scan?',
    narration:[`Imagine your chest X-ray is waiting to be read. Vote: a doctor alone, the AI alone, or both together? Keep your answer; we test it against real evidence later today.`],
    fig:FIG['Who reads your scan?'] },

  { part:1, nav:'Where AI is used', title:'AI along the patient journey',
