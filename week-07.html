/* ---------- map ---------- */
const MAP={
 'Finance':[
  ['Fraud detection','Banks score every card payment in milliseconds against your normal behaviour. Unusual amount, place, time or merchant raises the score; above a threshold the payment is held and you get an SMS.'],
  ['Credit scoring','Models estimate how likely a borrower is to repay. Some lenders add “alternative data” such as utility or phone-bill payments, which can help people with no credit history but raises privacy questions.'],
  ['Algorithmic trading','Computer programs place orders automatically, often in fractions of a second. A large share of trading on major stock exchanges is now automated.'],
  ['Risk management','Models estimate how much a bank or fund could lose in a bad week or month, and test portfolios against stress scenarios.'],
  ['Portfolio optimisation','Choosing how much to put in each asset to balance expected return against risk. AI methods estimate the inputs and search for good mixes. This is a central topic of the RB c reading.'],
  ['Anti-money-laundering','Systems scan networks of transfers for patterns linked to money laundering, then human analysts investigate the alerts.']],
 'Business':[
  ['Recommendations','Netflix engineers reported (2016) that about 80% of hours streamed on the service came from its recommendations rather than search.'],
  ['Demand forecasting','Retailers and airlines predict demand to set stock levels, staffing and prices, including dynamic pricing that changes during the day.'],
  ['Customer service','Chatbots answer routine questions in Arabic and English and pass complex cases to staff.'],
  ['Hiring','CV-screening tools rank applicants. Reuters reported in 2018 that Amazon dropped an experimental recruiting tool after it learned to downgrade CVs that mentioned the word “women\'s”.']]
};
function map(el){
  el.innerHTML=`<div class="tiles">${Object.keys(MAP).map(k=>`<div><h4>${k}</h4>${MAP[k].map((x,i)=>`<button type="button" data-k="${k}" data-i="${i}" aria-pressed="false">${x[0]}</button>`).join('')}</div>`).join('')}</div><div class="detail" id="md"></div>`;
  el.querySelectorAll('.tiles button').forEach(b=>b.addEventListener('click',()=>{ el.querySelectorAll('.tiles button').forEach(x=>x.setAttribute('aria-pressed',x===b)); const [t,d]=MAP[b.dataset.k][+b.dataset.i]; el.querySelector('#md').innerHTML=`<b>${t}</b> · <span class="tag">${b.dataset.k}</span><p style="margin:.4em 0 0">${d}</p>`; }));
  el.querySelector('.tiles button').click();
}

/* ---------- fraud signals ---------- */
// signals: [high amount, new country, night 00-05, new merchant type]; f = actually fraud
const TX=[
 ['Sun 09:12','Carrefour, Dubai','AED 312',[0,0,0,0],0],
 ['Sun 13:40','ENOC, Dubai','AED 140',[0,0,0,0],0],
 ['Mon 02:47','Electronics store, online (overseas)','AED 4,850',[1,1,1,1],1],
 ['Mon 08:05','RTA Nol top-up','AED 100',[0,0,0,0],0],
 ['Tue 20:15','Hotel, Istanbul','AED 2,900',[1,1,0,0],0],
 ['Tue 21:02','Restaurant, Istanbul','AED 410',[0,1,0,0],0],
 ['Wed 03:30','Gift cards, online','AED 1,500',[1,0,1,1],1],
 ['Wed 12:10','Talabat','AED 68',[0,0,0,0],0],
 ['Thu 01:15','Taxi app, Dubai','AED 54',[0,0,1,0],0],
 ['Thu 16:44','Gaming credits, overseas site','AED 920',[0,1,0,1],1],
 ['Fri 11:30','Furniture store, Dubai (new sofa)','AED 6,200',[1,0,0,1],0],
 ['Sat 04:05','Crypto exchange, overseas','AED 3,700',[1,1,1,1],1]];
const SIG=['Amount far above usual','New country','Night (00:00–05:00)','New type of merchant'];
function fraud(el){
  el.innerHTML=`<div class="ui stack"><p style="margin:0">Sara\'s card · one week · fictional data</p>
   <div class="checks">${SIG.map((s,i)=>`<label><input type="checkbox" id="sg${i}" checked> ${s}</label>`).join('')}</div>
   <label for="k">Block a payment when at least <span class="mono" id="kv">2</span> selected signals are present</label>
   <input type="range" id="k" min="1" max="4" step="1" value="2">
   <div class="scroll"><table class="tx"><thead><tr><th>When</th><th>Merchant</th><th>Amount</th><th>Signals</th><th>Result</th></tr></thead><tbody id="txb"></tbody></table></div>
   <div class="stat" id="fs"></div><div class="feedback" id="fm"></div></div>`;
  const draw=()=>{ const on=SIG.map((_,i)=>el.querySelector('#sg'+i).checked); const k=+el.querySelector('#k').value; el.querySelector('#kv').textContent=k;
    let caught=0,missed=0,falseb=0;
    el.querySelector('#txb').innerHTML=TX.map(([w,m,a,s,f])=>{ const sc=s.reduce((acc,v,i)=>acc+(v&&on[i]?1:0),0); const fl=sc>=k; if(f&&fl)caught++; else if(f)missed++; else if(fl)falseb++;
      return `<tr class="${fl?'flag':''}"><td>${w}</td><td>${m}</td><td>${a}</td><td>${s.map((v,i)=>`<i class="sig ${v&&on[i]?'on':''}" title="${SIG[i]}"></i>`).join('')}</td><td>${fl?'<span class="tag warn">blocked</span>':'<span class="tag">approved</span>'} ${f?'<span class="tag bad">fraud</span>':''}</td></tr>`; }).join('');
    el.querySelector('#fs').innerHTML=`<div><b>${caught}/4</b><span>fraud blocked</span></div><div><b style="color:var(--bad)">${missed}</b><span>fraud missed</span></div><div><b style="color:var(--warn)">${falseb}</b><span>genuine blocked</span></div>`;
    el.querySelector('#fm').innerHTML= falseb && !missed ? 'All fraud stopped, but Sara\'s real holiday and sofa purchases are being declined.' : missed && !falseb ? 'No annoyed customer, but fraud is getting through.' : missed && falseb ? 'The worst of both: fraud passes and genuine payments are blocked. Try other signals.' : 'Every fraud blocked and no genuine payment declined. Real systems use hundreds of signals and still cannot do this every time.'; };
  el.querySelectorAll('input').forEach(i=>i.addEventListener('input',draw)); draw();
}

/* ---------- diversification ---------- */
function diversify(el){
  const A={n:'Stock fund',r:8,s:16}, B={n:'Bond fund',r:4,s:6};
  el.innerHTML=`<div class="ui stack"><svg viewBox="0 0 560 280" id="pf" role="img" aria-label="Risk on the horizontal axis, expected return on the vertical axis, with the curve of all possible mixes of two funds"></svg>
   <label for="wA">Share in the stock fund: <span class="mono" id="wv">50%</span></label><input type="range" id="wA" min="0" max="100" value="50">
   <label for="rho">How closely the two funds move together (correlation): <span class="mono" id="rv">0.2</span></label><input type="range" id="rho" min="-1" max="1" step="0.1" value="0.2">
   <div class="feedback" id="pm"></div></div>`;
  const X=s=>50+s/18*480, Y=r=>240-(r-3)/6*210;
  const draw=()=>{ const w=+el.querySelector('#wA').value/100, rho=+el.querySelector('#rho').value;
    const port=w=>{ const r=w*A.r+(1-w)*B.r; const s=Math.sqrt(w*w*A.s*A.s+(1-w)**2*B.s*B.s+2*w*(1-w)*rho*A.s*B.s); return [s,r]; };
    let d='', minS=99,minW=0; for(let i=0;i<=100;i++){ const [s,r]=port(i/100); d+=(i?'L':'M')+X(s).toFixed(1)+','+Y(r).toFixed(1); if(s<minS){minS=s;minW=i;} }
    const [s,r]=port(w); el.querySelector('#wv').textContent=Math.round(w*100)+'%'; el.querySelector('#rv').textContent=rho.toFixed(1);
    let grid=''; for(let x=0;x<=18;x+=3) grid+=`<line x1="${X(x)}" x2="${X(x)}" y1="30" y2="240" stroke="var(--line)" stroke-width=".7"/><text x="${X(x)}" y="256" text-anchor="middle" font-size="10" class="t-muted t-mono">${x}%</text>`;
    for(let y=3;y<=9;y++) grid+=`<line x1="50" x2="530" y1="${Y(y)}" y2="${Y(y)}" stroke="var(--line)" stroke-width=".7"/><text x="42" y="${Y(y)+3}" text-anchor="end" font-size="10" class="t-muted t-mono">${y}%</text>`;
    el.querySelector('#pf').innerHTML=`${grid}<text x="290" y="275" text-anchor="middle" font-size="11" class="t-muted">Risk (ups and downs per year)</text><text x="12" y="20" font-size="11" class="t-muted">Expected return</text>
      <line x1="${X(B.s)}" y1="${Y(B.r)}" x2="${X(A.s)}" y2="${Y(A.r)}" stroke="var(--muted)" stroke-dasharray="4 4"/>
      <path d="${d}" fill="none" stroke="var(--wk)" stroke-width="2.5"/>
      <circle cx="${X(A.s)}" cy="${Y(A.r)}" r="5" fill="var(--muted)"/><text x="${X(A.s)-8}" y="${Y(A.r)-10}" text-anchor="end" font-size="11">${A.n}</text>
      <circle cx="${X(B.s)}" cy="${Y(B.r)}" r="5" fill="var(--muted)"/><text x="${X(B.s)+8}" y="${Y(B.r)+16}" font-size="11">${B.n}</text>
      <circle cx="${X(s)}" cy="${Y(r)}" r="8" fill="var(--wk)" stroke="var(--surface)" stroke-width="2"/>`;
    const naive=w*A.s+(1-w)*B.s;
    el.querySelector('#pm').innerHTML=`Your mix: expected return <b>${r.toFixed(1)}%</b>, risk <b>${s.toFixed(1)}%</b>. Averaging the two funds\' risks would suggest ${naive.toFixed(1)}%; diversification removes <b>${(naive-s).toFixed(1)} points</b>. The lowest-risk mix here is about ${minW}% stocks.`; };
  el.querySelectorAll('input').forEach(i=>i.addEventListener('input',draw)); draw();
}

/* ---------- flash crash sketch ---------- */
const CRASH=(()=>{ const pts=[[0,0],[40,-1],[80,-2],[110,-3.5],[125,-5],[132,-9],[138,-8.6],[150,-6],[175,-3.8],[210,-3.2],[260,-3.4],[300,-3.1]];

   ${[0,-3,-6,-9].map(v=>`<line x1="40" x2="540" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width=".7"/><text x="34" y="${Y(v)+3}" text-anchor="end" font-size="10" class="t-muted t-mono">${v}%</text>`).join('')}

   <text x="${X(142)}" y="236" text-anchor="middle" font-size="11" class="t-muted">≈ 2:32 – 3:08 pm</text>
   <text x="${X(170)}" y="${Y(-8.2)}" font-size="12" font-weight="700">Dow down ≈ 9%,</text>
   <text x="${X(170)}" y="${Y(-8.2)+15}" font-size="12">about 1,000 points</text>
   <text x="40" y="254" font-size="10" class="t-muted">Shape sketched for teaching, not plotted from market data. 6 May 2010, US markets.</text></svg>`; })();

const FCASES=[
 ['The Flash Crash, 6 May 2010','In about half an hour, US share prices fell sharply and then mostly recovered. The Dow Jones index dropped close to 1,000 points, roughly 9%. Investigators found that a large automated sell order met high-speed trading algorithms that withdrew and resold to each other, draining liquidity. Regulators later added “circuit breakers” that pause trading after sudden moves.','Automated systems interacting with each other can produce outcomes no single designer intended.'],
 ['Knight Capital, 1 August 2012','A software deployment error caused one of the largest US trading firms to send millions of unintended orders. It lost about US$440 million in roughly 45 minutes and had to be rescued and sold.','Speed multiplies mistakes. Testing, kill switches and human monitoring are risk controls.'],
 ['Apple Card credit limits, 2019','Customers publicly complained that women received lower credit limits than their husbands with similar finances. New York\'s financial regulator investigated and in 2021 found no violation of fair-lending law, but the episode showed how hard it is for a bank to explain an algorithm\'s decision to a customer.','Even when a model is lawful, people need understandable reasons for decisions about their money.'],
 ['Amazon\'s recruiting tool, 2018','Trained on ten years of CVs from a male-dominated industry, the tool learned to penalise signs that an applicant was a woman. Amazon dropped it.','A model trained on past decisions repeats past patterns, including unfair ones.']
];

    narration:[`You wake up to an SMS: <em>“A payment of AED 4,850 at an overseas electronics website was declined. Reply Y if this was you.”</em> You were asleep in Dubai. No human at the bank saw that payment. What made the system suspicious?`],
    notes:[`Ask who has had a card blocked while travelling. That block was probably an AI decision.`],
    fig:{label:`Vote`, build:el=>W.poll(el,{q:`What most likely triggered the block?`,opts:[`The amount alone`,`The time of night alone`,`A combination of unusual signals`,`A bank employee checked it`],reveal:i=>(i===2?'<b>Yes.</b> ':'<b>Most likely a combination.</b> ')+`Fraud models combine many signals: amount, place, time, merchant type, device. You will build a mini version in two scenes.`})} },

  { nav:'Where AI is used', title:'Where AI is used in finance and business', minutes:10,
    narration:[
     `In <strong>finance</strong>, AI protects (fraud, anti-money-laundering), lends (credit scoring), invests (trading, portfolio optimisation, robo-advice) and measures danger (risk management). In everyday <strong>business</strong>, it recommends, forecasts, prices, answers customers and screens applicants. Click the tiles for real examples.`,
     B.exam(`Why finance? Lots of data, clear numeric goals, decisions needed fast. <b>AI = prediction + pattern spotting + automation.</b>`)],
    notes:[`Every tile is prediction, pattern spotting or automation; ask students to label each.`],
    fig:{label:`Finance · Business`, build:el=>W.picker(el,MAP)} },

  { nav:'Fraud detection', title:'Risk management 1: fraud detection = anomaly detection', kind:'activity', minutes:20, wide:true,
    narration:[
     B.plain(`The AI learns your normal behaviour. When something does not fit your pattern, it raises a flag. This is called <b>anomaly detection</b>. Inputs: amount, place, time, device, merchant type. Output: a risk score, then approve, block, or ask.`),
     B.ex(`Normal: Sara spends AED 50–300 per purchase in Dubai. Suddenly: AED 12,000 at 3 a.m. in another country. The system blocks the payment and texts: “Was this you?”`),
     `Now build a detector on the right using one week of Sara's (fictional) payments. Choose which signals to watch and how many must appear before blocking. Block too easily and her real hotel in Istanbul and her new sofa get declined; block too rarely and criminals spend her money.`,
     B.exam(`<b>Fraud detection = anomaly detection.</b> Trade-off: false alarms vs missed fraud (the same trade-off as Week 6's threshold).`)],
    think:`Is it fair that a customer who travels or shops at night gets declined more often?`,
    notes:[`With all four signals at ≥2, all fraud is blocked but so are the hotel and sofa. Turning off “Amount far above usual” at ≥2 gives a perfect week. Then ask whether that rule would work next month (overfitting in plain words).`,`Anomaly detection is unsupervised or semi-supervised learning (Week 3).`],
    fig:{flow:[{t:'Inputs',s:'amount, place, time…',d:'Amount, place, time, device and merchant type for each payment.'},{t:'Compare',s:'with your normal',d:'The model compares the payment with your usual pattern and known fraud patterns.'},{t:'Risk score',s:'0 to 1',d:'Unusual combinations push the score up.'},{t:'Decide',s:'approve · block · ask',d:'Above the threshold the payment is blocked or you get a “Was this you?” text.'}],label:`Fictional card · 12 payments`, build:fraud} },

  { nav:'Credit scoring', title:'Risk management 2: credit scoring and its bias risk', minutes:15,
    narration:[
     B.plain(`Banks use models to predict whether you will repay a loan. The model learns from past loan decisions and outcomes. It gives a score; the bank approves or rejects.`),
     `Follow the bias loop on the right. If past decisions were unfair, what does a model trained on them learn? And because its decisions become new data, the unfairness can repeat itself.`,
     B.ex(`A model is not told the applicant's gender or nationality, but it uses postcode. If a postcode strongly matches a group, postcode acts as a <b>proxy variable</b> and the bias comes back in.`),
     B.exam(`Removing a sensitive column does <b>not</b> remove bias. <b>Proxy variables</b> can recreate it.`)],
    think:`Alternative data (phone-bill or utility payments) can give a first loan to someone with no credit history. When does that help, and when does it become surveillance?`,
    notes:[`Introduce “proxy variable” with the postcode example. It links back to Obermeyer (Week 6) and Amazon (Week 4).`],
    fig:{label:`The bias loop`, html:LOOP} },

  { nav:'Portfolio optimisation', title:'Portfolio optimisation: don\'t put all your eggs in one basket', kind:'activity', minutes:20, wide:true,
    narration:[
     B.plain(`A <b>portfolio</b> is your mix of investments. <b>Portfolio optimisation</b> means choosing the mix that gives the best return for the risk you accept. Core idea: <b>diversification</b> (Harry Markowitz, 1952).`),
     UMB,
     `Holding both gives a steady +7.5% whatever the weather. Now try two real-world-style funds on the right: move the mix, then change how closely they move together (correlation). When they move together, the protection disappears.`,
     B.plain(`<b>Where AI helps:</b> it scans thousands of assets, estimates how they move together, searches for the best mix under your limits, and can rebalance automatically. The reading covers methods such as neural networks and evolutionary algorithms for this.`),
     B.exam(`Return vs risk trade-off. Diversification lowers risk without giving up all return. AI makes the search <b>faster, not guaranteed</b>.`)],
    think:`In a crisis, many assets fall together and correlations jump. What happens to diversification exactly when you need it?`,
    notes:[`Markowitz: Modern Portfolio Theory (1952), Nobel Memorial Prize in Economic Sciences 1990. Walk the numbers: 0.5 × 20 + 0.5 × (−5) = 7.5.`,`Fund numbers in the widget are illustrative.`],
    fig:{label:`Two funds · illustrative numbers`, build:diversify} },

  { nav:'Robo-advisors and trading', fig:{label:'How a robo-advisor works', flow:[{t:'Questionnaire',s:'goals and risk',d:'Age, savings goal, time horizon, comfort with risk.'},{t:'Portfolio',s:'e.g. 80/20',d:'The app proposes a mix, e.g. 80% shares and 20% bonds for a 20-year-old.'},{t:'Rebalance',s:'automatically',d:'When markets move the mix drifts; the app sells and buys to restore it.'},{t:'Review',s:'human check',d:'Special situations still need a human adviser.'}]}, title:'Robo-advisors and algorithmic trading', minutes:10,
    narration:[
     `<table class="tbl"><thead><tr><th></th><th>Robo-advisor</th><th>Algorithmic trading</th></tr></thead><tbody><tr><td>What</td><td>An app that builds and rebalances your portfolio from your goals and risk comfort</td><td>Programs place orders automatically using rules or learned patterns; high-frequency trading sends thousands of orders per second</td></tr><tr><td>Benefit</td><td>Low fees, low minimums, always on</td><td>Speed, lower cost, no emotion</td></tr><tr><td>Limit</td><td>Not a human; weak on special situations</td><td>Errors spread at machine speed</td></tr></tbody></table>`,
     B.ex(`Robo-advisor: “I am 20, saving for 30 years, medium risk.” The app proposes about 80% shares and 20% bonds and rebalances each year.`)],
    notes:[`Robo-advisors serve ordinary customers; algorithmic trading is mostly institutional. Keep the definitions crisp.`] },

  { nav:'When algorithms go wrong', video:{id:'TDaFwnOiKVE',title:'How algorithms shape our world',by:'TED · Kevin Slavin',why:'Trading algorithms, the Flash Crash, and what happens when machines act faster than people can follow.'}, title:'When algorithms go wrong: Flash Crash and Knight Capital', minutes:10,
    narration:[
     `<b>Flash Crash, 6 May 2010:</b> US stocks fell about 9% within minutes, then largely recovered. Automated trading amplified a large sell order. Markets can move faster than humans can react.`,
     `<b>Knight Capital, 1 August 2012:</b> a software error sent unintended orders; about US$440 million was lost in around 45 minutes. No one could stop it fast enough. Testing and “kill switches” are essential.`,
     B.plain(`Automation brings speed. Speed turns small mistakes into big losses before humans notice.`),
     B.exam(`Exam link: <b>operational risk, systemic risk</b>, and the need for human oversight and kill switches.`)],
    think:`Should there be a speed limit on trading algorithms, the way there is on Sheikh Zayed Road?`,
    notes:[`SEC/CFTC report linked the Flash Crash to a large automated sell order interacting with high-frequency trading. Regulators added circuit breakers.`],
    fig:{label:`Flash Crash · sketch`, html:CRASH} },

  { nav:'AI and economics', title:'AI and economics: markets, jobs and productivity', minutes:10,
    narration:[
     `The syllabus title ends with “economics”. Click the six effects on the right.`,
     B.exam(`Balanced exam answer: gains in <b>efficiency and access</b> vs concerns about <b>jobs, concentration and fairness</b>.`)],
    notes:[`Link to Week 4 (who benefits, IMF 40%).`],
    fig:{label:`Six economic effects`, build:el=>W.picker(el,{'Economy':[[`Forecasting`,`AI analyses news, prices and data to predict inflation, demand and trends.`],[`Productivity`,`Automation can lower costs and raise output in banks and firms.`],[`Jobs`,`Routine tasks (data entry, simple analysis) shrink; new roles (AI risk, data) grow.`],[`Inequality`,`Firms and countries with data and capital may gain most; others fall behind.`],[`Competition`,`Fintech start-ups challenge banks with AI-based services.`],[`Regulation`,`Regulators ask for explainability and fairness in credit and trading.`]]})} },

  { nav:'Risks and limits', title:'Risks and limits of AI in finance', minutes:10,
    narration:[
     `Six risks summarise the week. Open each one and match it to a case from today or earlier weeks.`,
     B.exam(`<b>Systemic risk</b> = the failure of one part threatens the whole system. <b>Herding</b> = many act the same way at once.`)],
    notes:[`On Apple Card, be precise: the regulator found no fair-lending violation. The lesson is explanation, not proven discrimination.`],
    fig:{label:`Six risks · open each`, build:el=>W.accordion(el,RISKS)} },

  { nav:'AI for a UAE business', title:'Activity · Design AI for a UAE business', kind:'activity', minutes:15,
    narration:[
     `In groups of three, choose a business: a karak café chain with eight branches, a Dubai last-mile delivery start-up, or an online abaya store selling across the GCC. Or a family business you know.`,
     `Complete the canvas: one AI use from today that solves a real problem, the data, the benefit, the risk, and where a human stays in charge. Two groups present in 90 seconds; classmates each ask “Who could be harmed?”`],
    notes:[`Hints: café → demand forecasting to cut food waste; delivery → route optimisation; abaya store → recommendations or an Arabic chatbot.`,`This canvas can become the outline of Assignment 2.`],
    fig:{label:`AI opportunity canvas`, build:el=>W.worksheet(el,{id:'w7canvas',title:'GED 102 · Week 7 · AI opportunity canvas',fields:[
      {l:'Business and its problem',ph:'e.g. Karak café chain throws away 15% of pastries daily'},
      {l:'Which AI application?',hint:'Forecasting, recommendations, chatbot, fraud, pricing…'},
      {l:'What data would it learn from?',rows:2},
      {l:'How would you measure success?'},
      {l:'Main risk, and who is affected',rows:2},
      {l:'Where does a human stay in charge?',rows:2}]})} },

  { nav:'Assignment 2', title:'Assignment 2 · AI in my world', minutes:10, wide:true,
    narration:[
     `Assignment 2 brings Weeks 4 to 7 together. Choose one field and investigate how AI is used there, with real examples like this week's and the last two weeks'.`,
     `<ul><li>Use at least two real, checkable examples, and cite them.</li><li>Cover benefits <b>and</b> challenges; one-sided answers cannot meet expectations for critical reflection.</li><li>Use the essay pattern: <b>use → benefit → risk → example → human oversight</b>.</li><li>Follow the Week 5 class AI policy and declare any AI use.</li></ul>`],
    notes:[`Students post their chosen field on Moodle before leaving.`],
    fig:{label:`Brief and rubric · from the syllabus`, html:A2} },

  { nav:'Exam takeaways', full:true, title:'Exam takeaways · Week 7', kind:'exam', minutes:15,
    narration:[
     B.exam(`<b>If you remember only this…</b><ul><li><b>Uses:</b> fraud detection, credit scoring, risk management, portfolio optimisation, trading, robo-advice.</li><li><b>Fraud:</b> anomaly detection; trade-off between false alarms and missed fraud.</li><li><b>Portfolio:</b> diversification lowers risk (Markowitz). Return vs risk.</li><li><b>Algorithmic trading:</b> fast and cheap, but errors spread (Flash Crash, Knight Capital).</li><li><b>Credit bias:</b> past unfair data and proxy variables recreate bias.</li><li><b>Risks:</b> herding, black box, systemic risk, data quality, cost.</li></ul>`),
     `Which of the three fields (education, healthcare, finance) worries you most, and why? Then open the <a href="review.html">Midterm review</a> page.`],
    fig:{mindmap:{center:'AI in finance',branches:[{t:'Uses',items:['Fraud · credit · risk','Portfolio · trading · robo-advice']},{t:'Fraud',items:['Anomaly detection','False alarms vs missed fraud']},{t:'Credit',items:['The bias loop','Proxy variables (postcode)']},{t:'Portfolio',items:['Diversification (Markowitz 1952)','Return vs risk']},{t:'Trading risks',items:['Flash Crash 2010','Knight Capital 2012','Kill switches']},{t:'Big risks',items:['Herding · black box','Systemic risk · data quality']}]},label:`The week as a mind map · then likely exam questions`, build:el=>W.practice(el,[
      {q:`Explain how AI detects fraud, with an example.`,hint:`Learn normal behaviour, flag what does not fit (anomaly detection); Sara's AED 12,000 at 3 a.m. abroad; trade-off of false alarms vs missed fraud.`},
      {q:`What is diversification and how can AI help?`,hint:`Spread investments to lower risk (umbrella + sunscreen = steady 7.5%); AI estimates co-movement across thousands of assets and searches for the best mix.`},
      {q:`Discuss two risks of algorithmic trading.`,hint:`Errors at machine speed (Knight Capital, US$440m in 45 min); herding and systemic risk (Flash Crash); need kill switches and oversight.`},
      {q:`How can a credit-scoring model be biased?`,hint:`Biased past decisions (bias loop) and proxy variables such as postcode; fix by auditing, removing proxies, fairness testing, human review.`}])} },

    narration:[
