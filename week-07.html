function agenda(el, rows){
  const total=rows.reduce((a,r)=>a+r[1],0); let acc=0;
  el.innerHTML=`<div class="stack ui">${rows.map(([t,m,k])=>{ const s=acc; acc+=m; return `<div style="display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:8px;align-items:center"><div><div style="font-size:.86rem;margin-bottom:3px">${t}</div><div style="height:10px;background:var(--sunk);border-radius:3px;position:relative"><div style="position:absolute;left:${s/total*100}%;width:${m/total*100}%;top:0;bottom:0;border-radius:3px;background:${k==='a'?'var(--wk)':k==='b'?'var(--line)':k==='c'?'var(--good)':'var(--muted)'}"></div></div></div><span class="mono" style="text-align:right">${m}′</span></div>`; }).join('')}
   <div class="row mono" style="gap:14px;margin-top:4px"><span><i style="display:inline-block;width:10px;height:10px;background:var(--muted);border-radius:2px"></i> lecture</span><span><i style="display:inline-block;width:10px;height:10px;background:var(--wk);border-radius:2px"></i> activity</span><span><i style="display:inline-block;width:10px;height:10px;background:var(--good);border-radius:2px"></i> check</span><span>Total ${total} min</span></div></div>`;
}

/* ---------- map ---------- */
const MAP={
 'Finance':[
  ['Fraud detection','Banks score every card payment in milliseconds against your normal behaviour. Unusual amount, place, time or merchant raises the score; above a threshold the payment is held and you get an SMS.'],
  ['Credit scoring','Models estimate how likely a borrower is to repay. Some lenders add “alternative data” such as utility or phone-bill payments, which can help people with no credit history but raises privacy questions.'],
  ['Algorithmic trading','Computer programs place orders automatically, often in fractions of a second. A large share of trading on major stock exchanges is now automated.'],
  ['Risk management','Models estimate how much a bank or fund could lose in a bad week or month, and test portfolios against stress scenarios.'],
  ['Portfolio optimisation','Choosing how much to put in each asset to balance expected return against risk. AI methods estimate the inputs and search for good mixes. This is a central topic of the RB c reading.'],
  ['Anti-money-laundering','Systems scan networks of transfers for patterns linked to money laundering, then human analysts investigate the alerts.']],
 'Business':[
  ['Recommendations','Netflix engineers reported (2016) that about 80% of hours streamed on the service came from its recommendations rather than search.'],
  ['Demand forecasting','Retailers and airlines predict demand to set stock levels, staffing and prices, including dynamic pricing that changes during the day.'],
  ['Customer service','Chatbots answer routine questions in Arabic and English and pass complex cases to staff.'],
  ['Hiring','CV-screening tools rank applicants. Reuters reported in 2018 that Amazon dropped an experimental recruiting tool after it learned to downgrade CVs that mentioned the word “women\'s”.']]
};
function map(el){
  el.innerHTML=`<div class="tiles">${Object.keys(MAP).map(k=>`<div><h4>${k}</h4>${MAP[k].map((x,i)=>`<button type="button" data-k="${k}" data-i="${i}" aria-pressed="false">${x[0]}</button>`).join('')}</div>`).join('')}</div><div class="detail" id="md"></div>`;
  el.querySelectorAll('.tiles button').forEach(b=>b.addEventListener('click',()=>{ el.querySelectorAll('.tiles button').forEach(x=>x.setAttribute('aria-pressed',x===b)); const [t,d]=MAP[b.dataset.k][+b.dataset.i]; el.querySelector('#md').innerHTML=`<b>${t}</b> · <span class="tag">${b.dataset.k}</span><p style="margin:.4em 0 0">${d}</p>`; }));
  el.querySelector('.tiles button').click();
}

/* ---------- fraud signals ---------- */
// signals: [high amount, new country, night 00-05, new merchant type]; f = actually fraud
const TX=[
 ['Sun 09:12','Carrefour, Dubai','AED 312',[0,0,0,0],0],
 ['Sun 13:40','ENOC, Dubai','AED 140',[0,0,0,0],0],
 ['Mon 02:47','Electronics store, online (overseas)','AED 4,850',[1,1,1,1],1],
 ['Mon 08:05','RTA Nol top-up','AED 100',[0,0,0,0],0],
 ['Tue 20:15','Hotel, Istanbul','AED 2,900',[1,1,0,0],0],
 ['Tue 21:02','Restaurant, Istanbul','AED 410',[0,1,0,0],0],
 ['Wed 03:30','Gift cards, online','AED 1,500',[1,0,1,1],1],
 ['Wed 12:10','Talabat','AED 68',[0,0,0,0],0],
 ['Thu 01:15','Taxi app, Dubai','AED 54',[0,0,1,0],0],
 ['Thu 16:44','Gaming credits, overseas site','AED 920',[0,1,0,1],1],
 ['Fri 11:30','Furniture store, Dubai (new sofa)','AED 6,200',[1,0,0,1],0],
 ['Sat 04:05','Crypto exchange, overseas','AED 3,700',[1,1,1,1],1]];
const SIG=['Amount far above usual','New country','Night (00:00–05:00)','New type of merchant'];
function fraud(el){
  el.innerHTML=`<div class="ui stack"><p style="margin:0">Layla\'s card · one week · fictional data</p>
   <div class="checks">${SIG.map((s,i)=>`<label><input type="checkbox" id="sg${i}" checked> ${s}</label>`).join('')}</div>
   <label for="k">Block a payment when at least <span class="mono" id="kv">2</span> selected signals are present</label>
   <input type="range" id="k" min="1" max="4" step="1" value="2">
   <div class="scroll"><table class="tx"><thead><tr><th>When</th><th>Merchant</th><th>Amount</th><th>Signals</th><th>Result</th></tr></thead><tbody id="txb"></tbody></table></div>
   <div class="stat" id="fs"></div><div class="feedback" id="fm"></div></div>`;
  const draw=()=>{ const on=SIG.map((_,i)=>el.querySelector('#sg'+i).checked); const k=+el.querySelector('#k').value; el.querySelector('#kv').textContent=k;
    let caught=0,missed=0,falseb=0;
    el.querySelector('#txb').innerHTML=TX.map(([w,m,a,s,f])=>{ const sc=s.reduce((acc,v,i)=>acc+(v&&on[i]?1:0),0); const fl=sc>=k; if(f&&fl)caught++; else if(f)missed++; else if(fl)falseb++;
      return `<tr class="${fl?'flag':''}"><td>${w}</td><td>${m}</td><td>${a}</td><td>${s.map((v,i)=>`<i class="sig ${v&&on[i]?'on':''}" title="${SIG[i]}"></i>`).join('')}</td><td>${fl?'<span class="tag warn">blocked</span>':'<span class="tag">approved</span>'} ${f?'<span class="tag bad">fraud</span>':''}</td></tr>`; }).join('');
    el.querySelector('#fs').innerHTML=`<div><b>${caught}/4</b><span>fraud blocked</span></div><div><b style="color:var(--bad)">${missed}</b><span>fraud missed</span></div><div><b style="color:var(--warn)">${falseb}</b><span>genuine blocked</span></div>`;
    el.querySelector('#fm').innerHTML= falseb && !missed ? 'All fraud stopped, but Layla\'s real holiday and sofa purchases are being declined.' : missed && !falseb ? 'No annoyed customer, but fraud is getting through.' : missed && falseb ? 'The worst of both: fraud passes and genuine payments are blocked. Try other signals.' : 'Every fraud blocked and no genuine payment declined. Real systems use hundreds of signals and still cannot do this every time.'; };
  el.querySelectorAll('input').forEach(i=>i.addEventListener('input',draw)); draw();
}

/* ---------- diversification ---------- */
function diversify(el){
  const A={n:'Stock fund',r:8,s:16}, B={n:'Bond fund',r:4,s:6};
  el.innerHTML=`<div class="ui stack"><svg viewBox="0 0 560 280" id="pf" role="img" aria-label="Risk on the horizontal axis, expected return on the vertical axis, with the curve of all possible mixes of two funds"></svg>
   <label for="wA">Share in the stock fund: <span class="mono" id="wv">50%</span></label><input type="range" id="wA" min="0" max="100" value="50">
   <label for="rho">How closely the two funds move together (correlation): <span class="mono" id="rv">0.2</span></label><input type="range" id="rho" min="-1" max="1" step="0.1" value="0.2">
   <div class="feedback" id="pm"></div></div>`;
  const X=s=>50+s/18*480, Y=r=>240-(r-3)/6*210;
  const draw=()=>{ const w=+el.querySelector('#wA').value/100, rho=+el.querySelector('#rho').value;
    const port=w=>{ const r=w*A.r+(1-w)*B.r; const s=Math.sqrt(w*w*A.s*A.s+(1-w)**2*B.s*B.s+2*w*(1-w)*rho*A.s*B.s); return [s,r]; };
    let d='', minS=99,minW=0; for(let i=0;i<=100;i++){ const [s,r]=port(i/100); d+=(i?'L':'M')+X(s).toFixed(1)+','+Y(r).toFixed(1); if(s<minS){minS=s;minW=i;} }
    const [s,r]=port(w); el.querySelector('#wv').textContent=Math.round(w*100)+'%'; el.querySelector('#rv').textContent=rho.toFixed(1);
    let grid=''; for(let x=0;x<=18;x+=3) grid+=`<line x1="${X(x)}" x2="${X(x)}" y1="30" y2="240" stroke="var(--line)" stroke-width=".7"/><text x="${X(x)}" y="256" text-anchor="middle" font-size="10" class="t-muted t-mono">${x}%</text>`;
    for(let y=3;y<=9;y++) grid+=`<line x1="50" x2="530" y1="${Y(y)}" y2="${Y(y)}" stroke="var(--line)" stroke-width=".7"/><text x="42" y="${Y(y)+3}" text-anchor="end" font-size="10" class="t-muted t-mono">${y}%</text>`;
    el.querySelector('#pf').innerHTML=`${grid}<text x="290" y="275" text-anchor="middle" font-size="11" class="t-muted">Risk (ups and downs per year)</text><text x="12" y="20" font-size="11" class="t-muted">Expected return</text>
      <line x1="${X(B.s)}" y1="${Y(B.r)}" x2="${X(A.s)}" y2="${Y(A.r)}" stroke="var(--muted)" stroke-dasharray="4 4"/>
      <path d="${d}" fill="none" stroke="var(--wk)" stroke-width="2.5"/>
      <circle cx="${X(A.s)}" cy="${Y(A.r)}" r="5" fill="var(--muted)"/><text x="${X(A.s)-8}" y="${Y(A.r)-10}" text-anchor="end" font-size="11">${A.n}</text>
      <circle cx="${X(B.s)}" cy="${Y(B.r)}" r="5" fill="var(--muted)"/><text x="${X(B.s)+8}" y="${Y(B.r)+16}" font-size="11">${B.n}</text>
      <circle cx="${X(s)}" cy="${Y(r)}" r="8" fill="var(--wk)" stroke="var(--surface)" stroke-width="2"/>`;
    const naive=w*A.s+(1-w)*B.s;
    el.querySelector('#pm').innerHTML=`Your mix: expected return <b>${r.toFixed(1)}%</b>, risk <b>${s.toFixed(1)}%</b>. Averaging the two funds\' risks would suggest ${naive.toFixed(1)}%; diversification removes <b>${(naive-s).toFixed(1)} points</b>. The lowest-risk mix here is about ${minW}% stocks.`; };
  el.querySelectorAll('input').forEach(i=>i.addEventListener('input',draw)); draw();
}

/* ---------- flash crash sketch ---------- */
const CRASH=(()=>{ const pts=[[0,0],[40,-1],[80,-2],[110,-3.5],[125,-5],[132,-9],[138,-8.6],[150,-6],[175,-3.8],[210,-3.2],[260,-3.4],[300,-3.1]];
  const X=t=>40+t/300*500, Y=v=>40+(-v)/10*170;
  const d=pts.map(([t,v],i)=>(i?'L':'M')+X(t)+','+Y(v)).join('');
  return `<svg viewBox="0 0 560 260" role="img" aria-label="Sketch of the 6 May 2010 flash crash: a gradual decline, a sudden drop of about 9 percent, then a fast partial recovery">
   ${[0,-3,-6,-9].map(v=>`<line x1="40" x2="540" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width=".7"/><text x="34" y="${Y(v)+3}" text-anchor="end" font-size="10" class="t-muted t-mono">${v}%</text>`).join('')}
   <path d="${d}" fill="none" stroke="var(--wk)" stroke-width="2.5"/>
   <rect x="${X(125)}" y="30" width="${X(160)-X(125)}" height="190" fill="var(--wk-soft)"/>
   <text x="${X(142)}" y="236" text-anchor="middle" font-size="11" class="t-muted">≈ 2:32 – 3:08 pm</text>
   <text x="${X(170)}" y="${Y(-8.2)}" font-size="12" font-weight="700">Dow down ≈ 9%,</text>
   <text x="${X(170)}" y="${Y(-8.2)+15}" font-size="12">about 1,000 points</text>
   <text x="40" y="254" font-size="10" class="t-muted">Shape sketched for teaching, not plotted from market data. 6 May 2010, US markets.</text></svg>`; })();

const FCASES=[
 ['The Flash Crash, 6 May 2010','In about half an hour, US share prices fell sharply and then mostly recovered. The Dow Jones index dropped close to 1,000 points, roughly 9%. Investigators found that a large automated sell order met high-speed trading algorithms that withdrew and resold to each other, draining liquidity. Regulators later added “circuit breakers” that pause trading after sudden moves.','Automated systems interacting with each other can produce outcomes no single designer intended.'],
 ['Knight Capital, 1 August 2012','A software deployment error caused one of the largest US trading firms to send millions of unintended orders. It lost about US$440 million in roughly 45 minutes and had to be rescued and sold.','Speed multiplies mistakes. Testing, kill switches and human monitoring are risk controls.'],
 ['Apple Card credit limits, 2019','Customers publicly complained that women received lower credit limits than their husbands with similar finances. New York\'s financial regulator investigated and in 2021 found no violation of fair-lending law, but the episode showed how hard it is for a bank to explain an algorithm\'s decision to a customer.','Even when a model is lawful, people need understandable reasons for decisions about their money.'],
 ['Amazon\'s recruiting tool, 2018','Trained on ten years of CVs from a male-dominated industry, the tool learned to penalise signs that an applicant was a woman. Amazon dropped it.','A model trained on past decisions repeats past patterns, including unfair ones.']
];
function fcases(el){ el.innerHTML=`<div class="cases">${FCASES.map(([t,d,l],i)=>`<details ${i===0?'open':''}><summary>${t}</summary><p>${d}</p><p><span class="tag good">Lesson</span> ${l}</p></details>`).join('')}</div>`; }

     'Now change the correlation. When the funds move together (close to +1), diversification disappears. When they move in opposite directions, risk can shrink a lot.',
     'Where does AI come in? The hard part is not the curve; it is estimating future returns, risks and correlations from noisy data, and doing it for thousands of assets. The reading covers methods such as neural networks and evolutionary algorithms for this. Robo-advisors then apply the result automatically to your savings.'],
    think:'In a financial crisis, many assets fall together and correlations jump. What happens to the protection from diversification exactly when you need it?',
    notes:['Numbers are illustrative.','MTH 105 / MTH 195 link: correlation and standard deviation are the same concepts students meet in statistics.'],
    fig:{label:'Two funds · illustrative numbers', build:diversify} },

  { nav:'When speed goes wrong', title:'When speed goes wrong', minutes:15,
    narration:[
     'Automated trading gives speed. Speed also lets errors spread before any human can react.',
     'On 6 May 2010, US markets fell around 9% in minutes and then mostly recovered within about half an hour: the “Flash Crash”. In 2012, a software error made Knight Capital lose about US$440 million in roughly 45 minutes.',
     'Both cases connect to <strong>risk management</strong>: the risk is not only in the market but in the models and machines themselves. Regulators responded with circuit breakers that pause trading after sudden moves.'],
    think:'Should there be a speed limit on trading algorithms, the way there is on Sheikh Zayed Road?',
    notes:['Open the first two cases on the next scene during this discussion if time allows.'],
    fig:{label:'Flash Crash · sketch', html:CRASH} },

  { nav:'Fairness in money', title:'Fairness when algorithms decide about money', minutes:15,
    narration:[
     'Credit, insurance and hiring decisions shape people\'s lives. When AI makes or supports them, two questions come up again and again. <strong>Is it fair?</strong> And <strong>can anyone explain the decision?</strong>',
     'Open the four cases. Two are about speed and stability; two are about fairness and explanation. The Amazon case repeats the lesson of the Obermeyer case from Week 6: models trained on past decisions inherit past patterns.',
     'There is also a hopeful side. Alternative data can give a first loan to someone with no credit history, such as a young graduate or a new arrival. Whether that helps or harms depends on transparency and consent.'],
    think:'If an AI refused you a loan, what would you want the bank to tell you?',
    notes:['Precise point on Apple Card: the regulator found no fair-lending violation. Do not let students state it as “proven discrimination”; the lesson is about explanation.'],
    fig:{label:'Four cases · open each', build:fcases} },

  { nav:'AI for a UAE business', title:'Activity · Design AI for a UAE business', kind:'activity', minutes:25,

  { nav:'Assignment 2', title:'Assignment 2 · AI in my world', minutes:20, wide:true,

     'Assignment 2 brings Weeks 4 to 7 together. You choose one field and investigate how AI is used there, using real examples like the ones from this week and the last two weeks.',
