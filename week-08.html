.pb label{min-width:0}.pb select{width:100%;min-width:0;font:inherit;font-family:var(--f-display);font-size:.92rem;text-transform:none;letter-spacing:0;color:var(--ink);padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}

<script>
const {W} = Lecture;
const COPILOT='https://copilot.microsoft.com/', CRAIYON='https://www.craiyon.com/';
function copy(text, note){
  const done=()=>{ note.textContent='Copied ✓'; setTimeout(()=>note.textContent='',2000); };
  try{ navigator.clipboard.writeText(text).then(done,()=>{ note.textContent='Select the prompt and copy it'; }); }catch(e){ note.textContent='Select the prompt and copy it'; }
}
const openBtns=`<a class="btn" href="${COPILOT}" target="_blank" rel="noopener">Open Copilot ↗</a><a class="btn ghost" href="${CRAIYON}" target="_blank" rel="noopener">Open Craiyon (no account) ↗</a>`;

/* ---------- Game: can you beat 62%? ---------- */
function beat62(el){
  el.innerHTML=`<div class="g62">
    <div class="go"><a class="btn" href="https://www.realornotquiz.com/" target="_blank" rel="noopener">1 · Play “Real or Not?” ↗</a><span class="copied" style="color:var(--muted)">Microsoft’s free quiz · no account</span></div>
    <div class="inrow"><label for="g-ok">2 · Correct answers<input type="number" id="g-ok" min="0" max="50" inputmode="numeric" placeholder="11"></label>
      <label for="g-all">out of<input type="number" id="g-all" min="1" max="50" value="15" inputmode="numeric"></label></div>
    <div class="bars">
      <div class="gbar"><span>Coin flip</span><span class="t"><i style="width:50%;background:var(--line)"></i></span><b>50%</b></div>
      <div class="gbar"><span>12,500 people</span><span class="t"><i style="width:62%;background:var(--muted)"></i></span><b>62%</b></div>
      <div class="gbar"><span><b>You</b></span><span class="t"><i id="g-you" style="width:0;background:var(--wk)"></i></span><b id="g-pct">—</b></div>
    </div>
    <div class="verdict" id="g-v">Enter your score to compare.</div>
    <p class="mono" style="color:var(--muted);margin:0">Benchmark: Microsoft AI for Good study, 12,500+ participants, about 287,000 image judgements, 62% correct.</p></div>`;
  const ok=el.querySelector('#g-ok'), all=el.querySelector('#g-all');
  const upd=()=>{ const a=+ok.value, b=+all.value; if(!ok.value||!b){ return; } const p=Math.max(0,Math.min(100,Math.round(a/b*100)));
    el.querySelector('#g-you').style.width=p+'%'; el.querySelector('#g-pct').textContent=p+'%';
    el.querySelector('#g-v').textContent= p>62?'You beat the average. Which clue helped you most?': p>50?'Better than a coin flip, below the average. AI images are hard to spot.':'No better than guessing. That is why we cannot trust our eyes alone.'; };
  ok.addEventListener('input',upd); all.addEventListener('input',upd);
}

/* ---------- clues that give AI images away ---------- */
const CLUES=[
 {t:'Hands and fingers',d:'Extra, missing or merged fingers; hands holding objects in impossible ways.'},
 {t:'Text and signs',d:'Shop signs, labels and number plates with letters that look right from far away but are nonsense up close.'},
 {t:'Light, shadows, reflections',d:'Shadows falling in different directions; reflections in glasses or mirrors that do not match the scene.'},
 {t:'Too perfect',d:'Skin with no pores, hair that melts into the background, a glossy “studio” look everywhere.'},
 {t:'Background logic',d:'Railings that end in mid-air, windows that do not line up, repeated faces in a crowd.'},
 {t:'Check the source',d:'The strongest test is not your eyes: who posted it first, is there a credible source, and does a reverse image search find the original?'}];

/* ---------- Boden's three types (du Sautoy, ch. 2) ---------- */
const TYPES={
 'Exploratory':['Push the rules of an existing style to see how far they go.','Bach exploring every possibility of the fugue. An AI that writes new melodies inside one musical style works here.'],
 'Combinational':['Join two ideas that were never put together before.','A dish that mixes two cuisines. Image generators that combine “falcon” and “astronaut” work here.'],
 'Transformational':['Break a rule of the style so a new style becomes possible.','Picasso and Braque breaking single-point perspective to create Cubism. This is the hardest type for a machine.']};
function types(el){
  const k=Object.keys(TYPES);
  el.innerHTML=`<div class="types">${k.map(t=>`<button type="button" data-k="${t}" aria-pressed="false">${t}<small>${TYPES[t][0].split(' ').slice(0,5).join(' ')}…</small></button>`).join('')}</div><div class="pick-detail"></div>`;
  const bs=el.querySelectorAll('.types button'), d=el.querySelector('.pick-detail');
  bs.forEach(b=>b.addEventListener('click',()=>{ bs.forEach(x=>x.setAttribute('aria-pressed',x===b)); const [def,ex]=TYPES[b.dataset.k]; d.innerHTML=`<b>${b.dataset.k} creativity</b><p>${def}</p><p><span class="tag">Example</span> ${ex}</p>`; }));
  bs[0].click();
}

/* ---------- learning a style from paintings ---------- */
const STYLE=`<svg viewBox="0 0 580 220" role="img" aria-label="Hundreds of paintings by one artist are measured by a model, which then produces a new image in that style">
 ${[0,1,2,3].map(i=>`<rect x="${14+i*10}" y="${40+i*12}" width="96" height="120" rx="6" fill="var(--sunk)" stroke="var(--line)"/>`).join('')}
 <rect x="44" y="76" width="96" height="120" rx="6" fill="var(--surface)" stroke="var(--wk)" stroke-width="1.5"/>
 <circle cx="92" cy="122" r="16" fill="var(--wk-soft)" stroke="var(--wk)"/><path d="M66 180 Q92 150 118 180" fill="none" stroke="var(--wk)" stroke-width="2"/>
 <text x="92" y="214" text-anchor="middle" font-size="11" class="t-muted">hundreds of real paintings</text>
 <path d="M160 130 L222 130" stroke="var(--muted)" stroke-width="2" marker-end="url(#a8)"/>
 <rect x="230" y="88" width="130" height="84" rx="12" fill="var(--wk)"/>
 <text x="295" y="124" text-anchor="middle" font-size="14" font-weight="700" style="fill:var(--surface)">Model</text>
 <text x="295" y="142" text-anchor="middle" font-size="10" style="fill:var(--surface)">learns brushwork,</text>
 <text x="295" y="155" text-anchor="middle" font-size="10" style="fill:var(--surface)">colour and light</text>
 <path d="M368 130 L430 130" stroke="var(--muted)" stroke-width="2" marker-end="url(#a8)"/>
 <rect x="440" y="70" width="110" height="130" rx="6" fill="var(--surface)" stroke="var(--wk)" stroke-dasharray="5 4" stroke-width="1.5"/>
 <circle cx="495" cy="120" r="17" fill="var(--wk-soft)" stroke="var(--wk)"/><path d="M466 184 Q495 152 524 184" fill="none" stroke="var(--wk)" stroke-width="2"/>
 <text x="495" y="214" text-anchor="middle" font-size="11" class="t-muted">a new image “in the style”</text>
 <text x="295" y="30" text-anchor="middle" font-size="12" font-weight="700">Who is the artist of the new image?</text>
 <defs><marker id="a8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="var(--muted)"/></marker></defs></svg>`;

/* ---------- prompt builder ---------- */
const PB={
 subject:['a falcon flying over the Dubai skyline','an abra boat crossing Dubai Creek','a student studying in a library','a desert camp at night','a robot serving karak tea','a futuristic metro station'],
 style:['photorealistic photograph','watercolour painting','Impressionist oil painting','Cubist painting','Arabic geometric pattern art','3D animated film still','pencil sketch'],
 light:['golden-hour sunlight','soft morning light','neon city lights at night','dramatic sunset','overcast daylight'],
 view:['wide shot','close-up','bird’s-eye view','low angle looking up'],
 mood:['calm and peaceful','energetic and busy','mysterious','joyful','nostalgic']};
function builder(el){
  const lab={subject:'Subject',style:'Style',light:'Light',view:'Camera',mood:'Mood'};
  el.innerHTML=`<div class="pb"><div class="sel">${Object.keys(PB).map(k=>`<label for="pb-${k}">${lab[k]}<select id="pb-${k}">${PB[k].map(o=>`<option>${o}</option>`).join('')}</select></label>`).join('')}
    <label for="pb-r" style="align-self:end"><span>&nbsp;</span><button type="button" class="btn ghost" id="pb-r">🎲 Surprise me</button></label></div>
    <div class="prompt" id="pb-out"></div>
    <div class="go"><button type="button" class="btn" id="pb-c">Copy prompt</button>${openBtns}<span class="copied" id="pb-n"></span></div></div>`;
  const $=id=>el.querySelector('#'+id);
  const build=()=>{ const v=k=>$('pb-'+k).value; const st=v('style'); $('pb-out').textContent=`${st[0].toUpperCase()+st.slice(1)} of ${v('subject')}, ${v('light')}, ${v('view')}, ${v('mood')} mood.`; };
  Object.keys(PB).forEach(k=>$('pb-'+k).addEventListener('change',build));
  $('pb-r').addEventListener('click',()=>{ Object.keys(PB).forEach(k=>{ const s=$('pb-'+k); s.selectedIndex=Math.floor(Math.random()*s.options.length); }); build(); });
  $('pb-c').addEventListener('click',()=>copy($('pb-out').textContent,$('pb-n')));
  build();
}

/* ---------- ready-made prompt challenges ---------- */
const CHALLENGES=[
 {k:'Exploratory · same scene, three styles',p:'Dubai Creek at sunset with traditional abra boats, painted as an Impressionist oil painting.',n:'Now change only the style: try “Cubist painting”, then “Japanese woodblock print”. What stays the same?'},
 {k:'Combinational · join two ideas',p:'A traditional Emirati wind tower redesigned as a spaceship launching from the desert, detailed illustration.',n:'Which two ideas did the model combine? Did it add anything you did not ask for?'},
 {k:'Combinational · unusual pair',p:'A camel made entirely of glass and light, standing in a modern art museum, photorealistic.',n:'Look for clues: reflections, shadows, the floor. Would a classmate believe it is a photo?'},
 {k:'Transformational · break a rule',p:'A portrait painting where the face is drawn from four viewpoints at once, in a completely new art style that does not exist yet.',n:'Did it create a new style, or copy Cubism? This is the hardest test for AI.'},
 {k:'Fool your classmates',p:'A realistic smartphone photo of a university corridor in Dubai with students walking, slightly blurry, everyday lighting.',n:'Use it in the “Real or AI?” class game in Part 2: can a partner tell it from a real photo?'},
 {k:'Ethics · whose style?',p:'A portrait of a young woman wearing a pearl earring, in the style of a Dutch Golden Age painting.',n:'The original painter died in 1675. Is copying a living artist’s style different? Why?'}];
function cards(el){
  el.innerHTML=`<div class="cards">${CHALLENGES.map((c,i)=>`<div class="pc"><span class="k">${c.k}</span><div class="prompt" id="cp${i}">${c.p}</div><small>${c.n}</small>
    <div class="go"><button type="button" class="btn" data-i="${i}">Copy</button><span class="copied" id="cn${i}"></span></div></div>`).join('')}</div>
    <div class="go" style="margin-top:12px">${openBtns}</div>`;
  el.querySelectorAll('button[data-i]').forEach(b=>b.addEventListener('click',()=>copy(CHALLENGES[+b.dataset.i].p,el.querySelector('#cn'+b.dataset.i))));
}

/* ---------- class game tally ---------- */
function tally(el){
  el.innerHTML=`<div class="tally"><div><span class="mono" style="color:var(--muted)">GUESSED RIGHT</span><b id="t-r">0</b><button type="button" data-k="r">+1</button></div>
    <div><span class="mono" style="color:var(--muted)">FOOLED BY AI</span><b id="t-f">0</b><button type="button" data-k="f">+1</button></div></div>
    <p class="verdict" id="t-v" style="margin:10px 0 0;font-family:var(--f-display)">Swap phones with a partner and start guessing.</p>
    <button type="button" class="btn ghost" id="t-0" style="margin-top:8px">Reset</button>`;
  const n={r:0,f:0}, upd=()=>{ el.querySelector('#t-r').textContent=n.r; el.querySelector('#t-f').textContent=n.f; const t=n.r+n.f;
    el.querySelector('#t-v').textContent=t?`Your pair spotted ${Math.round(n.r/t*100)}% correctly (${t} images). The study average is 62%.`:'Swap phones with a partner and start guessing.'; };
  el.querySelectorAll('button[data-k]').forEach(b=>b.addEventListener('click',()=>{ n[b.dataset.k]++; upd(); }));
  el.querySelector('#t-0').addEventListener('click',()=>{ n.r=n.f=0; upd(); });
}

Lecture.mount({
  id:'w8', week:8, clo:2, short:'Week 8 · Art, Entertainment and Creativity',
  title:'Applications of AI: AI in Art, Entertainment and Creativity',
  meta:'RB d Chapters 2, 7, 8 · 3 hours · Midterm week',
  scenes:[
  { part:1, type:'activity', nav:'Today’s project', title:'Today’s project: Creative AI Studio',
    narration:[`Today you work in teams on a two-hour guided project that applies Weeks 8 and 9. Choose one of ten topics, follow the six stages, add your images and links, and save your work as a PDF. Use the scenes below whenever you need an idea, a tool or a prompt.`],
    fig:{label:`Team project · about 2 hours`, build:el=>{ el.innerHTML=`<div style="display:grid;gap:12px;font-family:var(--f-display)">
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">${[['1','Team','names and roles'],['2','Topic','1 of 10'],['3','Work','6 stages · 2 hours'],['4','Save PDF','your final work']].map(([n,t,d])=>`<div style="border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)"><b style="color:var(--wk);font-size:1.3rem">${n}</b> <b>${t}</b><br><small style="color:var(--muted)">${d}</small></div>`).join('')}</div>
      <a class="btn" href="studio-8-9.html" style="justify-self:start;font-size:1.05rem;padding:12px 20px">Open the Creative AI Studio →</a></div>`; }} },
  { part:1, nav:'Game: real or AI?', title:'Game: can you beat 62%?', wide:true,
    narration:[`Start with a game. Play Microsoft’s free Real or Not quiz on your phone and decide, image by image, whether a person or an AI made it. Then enter your score. In Microsoft’s study, more than 12,500 people were right only 62% of the time.`],
    fig:{label:`Real or AI? · play, then enter your score`, build:beat62} },

  { part:1, nav:'How to spot AI', title:'Clues that give AI images away',
    narration:[`AI images often slip on hands, text, shadows and backgrounds. Open each clue, then go back to the quiz and try again. Remember that the clues fade as models improve, so checking the source matters more than your eyes.`],
    fig:{label:`Six clues · open each`, build:el=>W.accordion(el,CLUES)} },

  { part:1, nav:'Can a machine create?', title:'Can a machine be creative?',
    narration:[`Ada Lovelace wrote in 1843 that a machine can only do what we order it to do, so it cannot originate anything. Du Sautoy uses her objection as a test: a machine is creative only if it makes something new, surprising and valuable that its programmers cannot explain. Vote before we go on.`],
    fig:{label:`Vote`, build:el=>W.poll(el,{q:`Can a machine be truly creative?`,opts:[`Yes, already today`,`Not yet, but one day`,`Never: creativity is human`,`It depends on how we define creativity`],reveal:i=>[`Then you need to show something new, surprising and valuable that its programmers cannot explain.`,`Many researchers agree. Today we look at how close machines have come.`,`That is Lovelace’s position. Keep it in mind when you see the cases in Part 3.`,`The strongest starting point. Boden’s three types of creativity, next, give us the definition.`][i]})} },

  { part:1, nav:'Three types', title:'Three types of creativity',
    narration:[`Margaret Boden, whom du Sautoy follows in Chapter 2, describes three types of creativity. Exploratory creativity pushes the rules of a style, combinational creativity joins ideas that were never joined, and transformational creativity breaks a rule so a new style becomes possible. You will test all three in the lab.`],
    src:`Du Sautoy, M. (2019). <em>The creativity code</em>, Chapter 2: Three Types of Creativity.`,
    fig:{label:`Boden’s three types · click each`, build:types} },

  { part:1, nav:'How AI makes images', title:'Two networks that compete: the GAN',
    narration:[`A generative adversarial network, invented in 2014, pairs two networks. The generator makes fake images; the discriminator tries to tell them from real ones. Each round the generator learns from its failures, until the fakes are hard to spot. That is why the quiz was difficult.`],
    fig:{label:`How a GAN learns`, flow:[
      {t:'Real images',s:'the training set',d:'Thousands of real paintings or photos.'},
      {t:'Generator',s:'makes a fake',d:'Starts from random noise and produces an image.'},
      {t:'Discriminator',s:'real or fake?',d:'Compares the fake with real images and gives a verdict.'},
      {t:'Feedback',s:'both improve',d:'The generator learns what gave it away; the discriminator learns new tells.'},
      {t:'Repeat',s:'until convincing',d:'After many rounds the fakes look real to the discriminator, and often to us.'}]} },

  { part:1, nav:'Learning from the masters', title:'Learning from the masters',
    narration:[`A model can study hundreds of paintings by one artist and produce a new image in that style. In 2016 The Next Rembrandt project did this with 346 Rembrandt paintings and 3D-printed the result. It raises the question at the centre of this week: who is the artist?`],
    src:`Du Sautoy, M. (2019). <em>The creativity code</em>, Chapters 7 and 8.`,
    fig:{label:`Learning a style from data`, html:STYLE} },

  { part:2, nav:'Prompt builder', title:'Build a prompt, make an image', wide:true,
    narration:[`A good image prompt names a subject, a style, the light, the camera view and a mood. Pick from the menus or press Surprise me, copy the prompt, and paste it into Copilot or Craiyon. Change one part at a time and compare the results.`],
    fig:{label:`Prompt builder`, build:builder} },

  { part:2, nav:'Prompt challenges', title:'Six prompt challenges', full:true,
    narration:[`Each card tests one idea from Part 1. Copy a prompt, generate the image, and answer the question under it. Work in pairs and keep your best image for the class game.`],
    fig:{label:`Copy, generate, compare`, build:cards} },

  { part:2, nav:'Which face is real?', title:'Game: which face is real?',
    narration:[`This game, made by two University of Washington professors, shows two faces: one photo of a real person and one made by a GAN. Play ten rounds and use the clues you learned.`],
    fig:{label:`Tools lab`, build:el=>W.tool(el,{name:'Which Face Is Real?',by:'University of Washington · Jevin West and Carl Bergstrom',url:'https://www.whichfaceisreal.com/',steps:[
      {t:'Look',s:'two faces',d:'One is a photo, one was generated by a GAN.'},
      {t:'Choose',s:'click the real one',d:'Decide before you zoom in.'},
      {t:'Check',s:'the clues',d:'Look at the background, ears, earrings and hair edges.'},
      {t:'Count',s:'ten rounds',d:'Write down your score and compare with your partner.'}]})} },

  { part:2, nav:'Class game', title:'Class game: fool your partner',
    narration:[`Take one real photo on campus with your phone and generate one AI image with the “Fool your classmates” prompt. Show both to your partner in random order. Count every right guess and every time your partner is fooled.`],
    fig:{label:`Pair score`, build:tally} },

  { part:3, nav:'Case: Christie’s', title:'Case: a GAN portrait sells at auction',
    narration:[`In October 2018 Christie’s in New York sold Portrait of Edmond de Belamy, made with a GAN by the Paris collective Obvious, for 432,500 US dollars, about 43 times its estimate. The code it used had been shared online by another programmer, which started a debate about who deserves the credit.`],
    fig:{label:`Real case`, build:el=>W.news(el,{outlet:'artnet News',date:'25 October 2018',head:'The first AI-generated portrait ever sold at auction fetches $432,500, 43 times its estimate',dek:'Portrait of Edmond de Belamy, made by the collective Obvious with a generative adversarial network.',url:'https://news.artnet.com/market/first-everartificial-intelligence-portrait-painting-sells-at-christies-1379902'})} },

  { part:3, nav:'Case: the art prize', title:'Case: an AI image wins first prize',
